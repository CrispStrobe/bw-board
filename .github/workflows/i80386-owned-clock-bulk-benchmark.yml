name: Owned 386 private dispatch pinned CPU gate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: owned-dispatch-fixed-gate
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: publication
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fe1eff2039520536350922a2164c8bbe29404c68
          path: baseline-checkout
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Download exact original build artifact and record context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/owned-dispatch-context"
          gh api /repos/CrispStrobe/bw-board/actions/artifacts/11226630502 > "$RUNNER_TEMP/owned-dispatch-context/artifact-metadata.json"
          gh api /repos/CrispStrobe/bw-board/actions/artifacts/11226630502/zip > "$RUNNER_TEMP/original-build.zip"
          {
            sha256sum publication/scripts/ci-benchmark-i80386-owned-dispatch.py
            cat /proc/loadavg
            # CPU identity is required; optional kernel context reports absence explicitly.
            lscpu
            optional_context_file() {
              if [ -r "$1" ]; then
                printf 'CONTEXT_FILE %s\n' "$1"
                cat "$1" || printf 'CONTEXT_READ_FAILED %s\n' "$1"
              else
                printf 'CONTEXT_MISSING_OR_UNREADABLE %s\n' "$1"
              fi
            }
            for context_file in /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io \
              /sys/fs/cgroup/cpu.max \
              /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us \
              /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us; do
              optional_context_file "$context_file"
            done
            node --version
            uname -a
            uptime
            free -h
            git -C publication rev-parse HEAD
            git -C baseline-checkout rev-parse HEAD
            sha256sum "$RUNNER_TEMP/original-build.zip"
          } > "$RUNNER_TEMP/owned-dispatch-context/context.txt"
      - name: Authenticate, relocate and run one fixed paired gate
        shell: bash
        run: |
          set -euo pipefail
          python3 publication/scripts/ci-benchmark-i80386-owned-dispatch.py > "$RUNNER_TEMP/owned-dispatch-context/parent.stdout" 2> "$RUNNER_TEMP/owned-dispatch-context/parent.stderr"
      - name: Retain complete result and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-dispatch-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owned-dispatch-context
            ${{ runner.temp }}/owned-dispatch-gate
          retention-days: 14
          if-no-files-found: error
