            /v1_ex_real_mode/C1.5.MOO.gz
            /v1_ex_real_mode/C1.7.MOO.gz
            /v1_ex_real_mode/66C1.4.MOO.gz
            /v1_ex_real_mode/66C1.5.MOO.gz
