            /v1_ex_real_mode/6766C1.4.MOO.gz
            /v1_ex_real_mode/6766C1.5.MOO.gz
            /v1_ex_real_mode/6766C1.7.MOO.gz
      - name: Grade the bounded 386 profiles and reject corrupted evidence
        env:
          SST386_ROOT: ${{ github.workspace }}/sst386
        run: |
          set -euo pipefail
          I386_RECEIPTS=$(mktemp -d "$RUNNER_TEMP/i386-samples.XXXXXX")
          export I386_RECEIPTS
          echo "I386_RECEIPTS=$I386_RECEIPTS" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test test/i80386-experimental.test.mjs test/i80386-fault-delivery.test.mjs test/i80386-paging.test.mjs test/i80386-reset-io.test.mjs test/i80386-group3.test.mjs test/i80386-segment-string.test.mjs test/i80386-moo-parser.test.mjs test/i80386-group5.test.mjs test/i80386-far-pointer.test.mjs test/i80386-alu-complete.test.mjs test/i80386-at-machine.test.mjs test/i80386-pusha-popa.test.mjs test/i80386-moffs.test.mjs test/i80386-rotate.test.mjs test/i80386-system-selectors.test.mjs test/i80386-lea.test.mjs test/i80386-segment-stack.test.mjs test/i80386-pop-rm.test.mjs test/i80386-protected-far.test.mjs test/i80386-io-bitmap.test.mjs test/i80386-conforming.test.mjs test/i80386-vm86.test.mjs \
            | tee "$I386_RECEIPTS/tests.tap"
          for profile in add-sizes byte-movx shifts segment-mov xchg group5-basic far-pointer alu-complete pusha-popa moffs rotates rotate-full-circle lea segment-stack pop-rm push-imm8; do
            I386_MOO_PROFILE="$profile" node scripts/verify-i80386-moo-sample.mjs \
              > "$I386_RECEIPTS/$profile.json"
          done
          for mutation in ram stray-write; do
            if I386_MOO_MUTATION="$mutation" node scripts/verify-i80386-moo-sample.mjs \
              > "$I386_RECEIPTS/rejected-$mutation.json"; then
              echo "386 hardware comparator accepted $mutation mutation" >&2
              exit 1
            fi
          done
          if I386_MOO_PROFILE=rotate-full-circle I386_MOO_MUTATION=carry node scripts/verify-i80386-moo-sample.mjs \
            > "$I386_RECEIPTS/rejected-carry.json"; then
            echo "386 full-circle comparator accepted carry mutation" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const dir=process.env.I386_RECEIPTS;
          const read=name=>JSON.parse(fs.readFileSync(`${dir}/${name}.json`));
          for(const [profile,count,excluded,prefixExcluded=0] of [['add-sizes',12,888],['byte-movx',36,2600],['shifts',36,3111],['segment-mov',6,46],['xchg',9,16,58],['group5-basic',21,319,194],['far-pointer',30,955],['alu-complete',42,163],['pusha-popa',12,405],['moffs',24,452],['rotates',36,904],['rotate-full-circle',2,134],['lea',12,2704],['segment-stack',66,690],['pop-rm',12,601],['push-imm8',6,68]]) {
            const r=read(profile);
            assert.equal(r.accounting.admitted,count);
            assert.equal(r.accounting.exceptionExcluded,excluded);
            assert.equal(r.accounting.profileExcluded,prefixExcluded);
            assert.equal(r.accounting.revoked,0);
            assert.equal(r.accounting.unsupported,0);
            assert.equal(r.accounting.failures,0);
          }
          const carry=read('rejected-carry');
          assert.equal(carry.mutation,'carry');
          assert.equal(carry.accounting.unsupported,0);
          assert.equal(carry.failures.length,1);
          assert.equal(carry.failures[0].differences.length,1);
          assert.equal(carry.failures[0].differences[0].field,'eflags');
          for(const mutation of ['ram','stray-write']) {
            const r=read(`rejected-${mutation}`);
            assert.equal(r.mutation,mutation);
            assert.equal(r.accounting.unsupported,0);
            assert.equal(r.failures.length,1);
            assert.equal(r.failures[0].differences.length,1);
            const field=r.failures[0].differences[0].field;
            if(mutation==='stray-write')assert.equal(field,'unexpected-write:f00000');
            else assert.match(field,/^ram:[0-9a-f]+$/);
          }
          assert.match(fs.readFileSync(`${dir}/tests.tap`,'utf8'),/^# skipped 0$/m);
          fs.writeFileSync(`${dir}/context.json`,JSON.stringify({revision:process.env.GITHUB_SHA,
            run:process.env.GITHUB_RUN_ID,node:process.version,scope:'bounded real-mode 386EX samples; not full 386DX compatibility'},null,2)+'\n');
          NODE
      - name: Upload source-bound 386 sample evidence
        if: ${{ always() && env.I386_RECEIPTS != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sampled386-${{ github.sha }}-${{ github.run_attempt }}
