name: 80286 qualification

on:
  push:
    branches: ['lane/astra-286-integration', 'lane/astra-x86-next', 'lane/astra-x86-idt', 'lane/astra-x86-memory-isa', 'lane/astra-x86-protection-at', 'lane/astra-x86-tasks', 'lane/astra-x86-at-boot']
  workflow_dispatch:
    inputs:
      evidence:
        description: Evidence to collect from the exact dispatched revision
        required: true
        type: choice
        default: both
        options:
          - both
          - full-semantic
          - wired-bios
      run_dos:
        description: Run the long reference wired DOS boot (manual dispatch only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: harris-evidence-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.run_dos && 'dos' || 'qualification' }}
  cancel-in-progress: false

jobs:
  protected-pcjs-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check out the pinned PCjs protected-mode oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jeffpar/pcjs
          ref: c7f21b4fa2bdedac3d5c73094a6402fdc8b24c70
          path: pcjs
          sparse-checkout: |
            package.json
            machines/modules/v2
            machines/pcx86/modules/v2
          sparse-checkout-cone-mode: false
      - name: Compare the bounded protected-mode bootstrap and IDT gates with PCjs
        env:
          PCJS_ROOT: ${{ github.workspace }}/pcjs
        run: |
          set -euo pipefail
          RECEIPT_DIR=$(mktemp -d "$RUNNER_TEMP/protected-286-pcjs.XXXXXX")
          export RECEIPT_DIR
          echo "RECEIPT_DIR=$RECEIPT_DIR" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$PCJS_ROOT" rev-parse HEAD)" = c7f21b4fa2bdedac3d5c73094a6402fdc8b24c70
          test -z "$(git -C "$PCJS_ROOT" status --porcelain)"
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(process.env.RECEIPT_DIR+"/context.json",JSON.stringify({schemaVersion:1,revision:process.env.GITHUB_SHA,pcjsRevision:"c7f21b4fa2bdedac3d5c73094a6402fdc8b24c70",node:process.version,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,scope:"bounded protected-286 and same-ring 386 PCjs semantic oracles"},null,2)+"\n",{flag:"wx"});'
          node scripts/compare-pcjs-protected286.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected286.json"
          node scripts/compare-pcjs-protected286-idt.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected286-idt.json"
          node scripts/compare-pcjs-protected286-isa.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected286-isa.json"
          node scripts/compare-pcjs-protected286-rep.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected286-rep.json"
          node scripts/compare-pcjs-protected286-privilege.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected286-privilege.json"
          node scripts/compare-pcjs-protected286-common-isa.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected286-common-isa.json"
          node scripts/compare-pcjs-protected286-external-images.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected286-external-images.json"
          node scripts/compare-pcjs-protected386.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected386.json"
          if I386_ORACLE_MUTATION=result node scripts/compare-pcjs-protected386.mjs \
            > "$RECEIPT_DIR/rejected-386-result.json"; then
            echo "386 oracle failed to reject result mutation" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RECEIPT_DIR+'/rejected-386-result.json'));
          assert.equal(report.status,'fail');
          assert.equal(report.mutation,'result');
          assert.deepEqual(report.differences.map(d=>d.field),['result']);
          NODE
          node scripts/compare-pcjs-protected386-faults.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected386-faults.json"
          for mutation in frame if; do
            if I386_FAULT_ORACLE_MUTATION="$mutation" node scripts/compare-pcjs-protected386-faults.mjs \
              > "$RECEIPT_DIR/rejected-386-$mutation.json"; then
              echo "386 fault oracle accepted $mutation mutation" >&2
              exit 1
            fi
            MUTATION="$mutation" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const mutation=process.env.MUTATION;
          const r=JSON.parse(fs.readFileSync(`${process.env.RECEIPT_DIR}/rejected-386-${mutation}.json`));
          assert.equal(r.status,'fail');
          assert.equal(r.mutation,mutation);
          assert.deepEqual(r.differences.map(d=>d.case),[mutation==='frame'?'interrupt32':'trap32']);
          NODE
          done
          if I386_FAULT_ORACLE_MUTATION=ring-stack node scripts/compare-pcjs-protected386-faults.mjs \
            > "$RECEIPT_DIR/rejected-386-ring-stack.json"; then
            echo "386 ring oracle accepted a saved-stack mutation" >&2
            exit 1
          fi
          if I386_FAULT_ORACLE_RING_BUDGET=5 node scripts/compare-pcjs-protected386-faults.mjs \
            > "$RECEIPT_DIR/rejected-386-ring-budget.json"; then
            echo "386 ring oracle accepted incomplete execution" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read=name=>JSON.parse(fs.readFileSync(`${process.env.RECEIPT_DIR}/rejected-386-ring-${name}.json`));
          const stack=read('stack');
          assert.equal(stack.status,'fail');
          assert.equal(stack.mutation,'ring-stack');
          assert.deepEqual(stack.differences.map(d=>d.case),['ringTransitionExpected','ringTransition']);
          const budget=read('budget');
          assert.equal(budget.status,'fail');
          for(const engine of ['reference','actual']) {
            assert.equal(budget.cases.ringTransition[engine].completed,false);
            assert.ok(budget.differences.some(d=>d.case==='ringTransitionExpected'&&d.engine===engine));
          }
          NODE
          if I386_FAULT_ORACLE_MUTATION=gate-parameter node scripts/compare-pcjs-protected386-faults.mjs \
            > "$RECEIPT_DIR/rejected-386-gate-parameter.json"; then
            echo "386 call-gate oracle accepted a copied-parameter mutation" >&2
            exit 1
          fi
          if I386_FAULT_ORACLE_GATE_BUDGET=5 node scripts/compare-pcjs-protected386-faults.mjs \
            > "$RECEIPT_DIR/rejected-386-gate-budget.json"; then
            echo "386 call-gate oracle accepted incomplete execution" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read=name=>JSON.parse(fs.readFileSync(`${process.env.RECEIPT_DIR}/rejected-386-gate-${name}.json`));
          const parameter=read('parameter');
          assert.equal(parameter.status,'fail');
          assert.equal(parameter.mutation,'gate-parameter');
          assert.deepEqual(parameter.differences.map(d=>d.case),['callGateExpected','callGate']);
          const budget=read('budget');
          assert.equal(budget.status,'fail');
          for(const engine of ['reference','actual']) {
            assert.equal(budget.cases.callGate[engine].completed,false);
            assert.ok(budget.differences.some(d=>d.case==='callGateExpected'&&d.engine===engine));
          }
          NODE
          for mutation in io-access conforming-cpl vm-frame; do
            if I386_FAULT_ORACLE_MUTATION="$mutation" node scripts/compare-pcjs-protected386-faults.mjs \
              > "$RECEIPT_DIR/rejected-386-$mutation.json"; then
              echo "386 protection oracle accepted $mutation mutation" >&2
              exit 1
            fi
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          for (const [mutation,expected] of [
            ['io-access',['ioDeniedExpected','ioDenied']],
            ['conforming-cpl',['conformingExpected']],
            ['vm-frame',['vm86Expected','vm86RoundTrip']],
          ]) {
            const report=JSON.parse(fs.readFileSync(`${process.env.RECEIPT_DIR}/rejected-386-${mutation}.json`));
            assert.equal(report.status,'fail');
            assert.equal(report.mutation,mutation);
            assert.deepEqual(report.differences.map(d=>d.case),expected);
          }
          NODE
          node scripts/compare-pcjs-i80386-system-selectors.mjs \
            | tee "$RECEIPT_DIR/pcjs-i80386-system-selectors.json"
          for mutation in busy budget; do
            if I386_SYSTEM_ORACLE_MUTATION="$mutation" node scripts/compare-pcjs-i80386-system-selectors.mjs \
              > "$RECEIPT_DIR/rejected-386-system-$mutation.json"; then
              echo "386 system oracle accepted $mutation mutation" >&2
              exit 1
            fi
            MUTATION="$mutation" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const mutation=process.env.MUTATION;
          const r=JSON.parse(fs.readFileSync(`${process.env.RECEIPT_DIR}/rejected-386-system-${mutation}.json`));
          assert.equal(r.status,'fail');
          assert.equal(r.mutation,mutation);
          if(mutation==='busy')assert.deepEqual(r.differences.map(d=>d.field),['actual.busyAccess']);
          else {
            assert.equal(r.differences.length,20);
            for(const route of ['reference','actual']) {
              assert.equal(r[route].halted,false);
              assert.ok(r.differences.some(d=>d.field===`${route}.halted`));
            }
          }
          NODE
          done
          node scripts/compare-pcjs-i80386-group3.mjs \
            | tee "$RECEIPT_DIR/pcjs-i80386-group3.json"
          if I386_GROUP3_ORACLE_MUTATION=quotient node scripts/compare-pcjs-i80386-group3.mjs \
            > "$RECEIPT_DIR/rejected-386-group3-quotient.json"; then
            echo "386 group3 oracle accepted quotient mutation" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(`${process.env.RECEIPT_DIR}/rejected-386-group3-quotient.json`));
          assert.equal(r.status,'fail');
          assert.equal(r.mutation,'quotient');
          assert.deepEqual(r.differences.map(d=>d.case),['div16']);
          NODE
          node scripts/compare-pcjs-protected386-paging.mjs \
            | tee "$RECEIPT_DIR/pcjs-protected386-paging.json"
          if I386_PAGING_ORACLE_MUTATION=cr2 node scripts/compare-pcjs-protected386-paging.mjs \
            > "$RECEIPT_DIR/rejected-386-paging-cr2.json"; then
            echo "386 paging oracle accepted CR2 mutation" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(`${process.env.RECEIPT_DIR}/rejected-386-paging-cr2.json`));
          assert.equal(r.status,'fail');
          assert.equal(r.mutation,'cr2');
          assert.deepEqual(r.differences.map(d=>d.field),['cr2','completion:local:cr2']);
          NODE
          node --test test/i80286-protected-external-images.test.mjs \
            | tee "$RECEIPT_DIR/protected286-external-image-tests.log"
          for mutation in video taskreturn fixturehash sector taskstate; do
            if EXTERNAL286_ORACLE_MUTATION="$mutation" node scripts/compare-pcjs-protected286-external-images.mjs \
              > "$RECEIPT_DIR/rejected-external-$mutation.json"; then
              echo "external image oracle failed to reject $mutation mutation" >&2
              exit 1
            fi
            MUTATION="$mutation" RECEIPT="$RECEIPT_DIR/rejected-external-$mutation.json" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RECEIPT));
          const expected={
            video:[['hellop.img','videoSha256']],
            taskreturn:[['tasksw.img','trSequence']],
            fixturehash:[['ptr_validn.img','inputSha256']],
            sector:[['hellop.img','sectorSha256'],['hellop.img','sectorByteDifferences']],
            taskstate:[['tasksw.img','known task-state oracle differences']],
          };
          assert.equal(report.mutation,process.env.MUTATION);
          assert.equal(report.status,'fail');
          assert.deepEqual(report.unexpectedDifferences.map(d=>[d.image,d.field]),expected[process.env.MUTATION]);
          NODE
          done
          if COMMON_ISA_ORACLE_MUTATION=ax node scripts/compare-pcjs-protected286-common-isa.mjs \
            > "$RECEIPT_DIR/rejected-common-isa-ax.json"; then
            echo "common ISA oracle failed to reject register mutation" >&2
            exit 1
          fi
          RECEIPT="$RECEIPT_DIR/rejected-common-isa-ax.json" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RECEIPT));
          assert.equal(report.mutation,'ax');
          assert.equal(report.status,'fail');
          assert.deepEqual(report.differences.map(d=>d.field),['ax']);
          NODE
          if PRIVILEGE_ORACLE_MUTATION=frame node scripts/compare-pcjs-protected286-privilege.mjs \
            > "$RECEIPT_DIR/rejected-privilege-frame.json"; then
            echo "protected privilege oracle failed to reject frame mutation" >&2
            exit 1
          fi
          RECEIPT="$RECEIPT_DIR/rejected-privilege-frame.json" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RECEIPT));
          assert.equal(report.mutation,'frame');
          assert.equal(report.status,'fail');
          assert.deepEqual(report.differences.map(d=>d.field),['firstFrame']);
          NODE
          if REP_ORACLE_MUTATION=destination node scripts/compare-pcjs-protected286-rep.mjs \
            > "$RECEIPT_DIR/rejected-rep-destination.json"; then
            echo "protected REP oracle failed to reject destination mutation" >&2
            exit 1
          fi
          RECEIPT="$RECEIPT_DIR/rejected-rep-destination.json" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RECEIPT));
          assert.equal(report.mutation,'destination');
          assert.equal(report.status,'fail');
          assert.deepEqual(report.differences.map(d=>d.field),['destination']);
          NODE
          if ISA_ORACLE_MUTATION=result node scripts/compare-pcjs-protected286-isa.mjs \
            > "$RECEIPT_DIR/rejected-isa-result.json"; then
            echo "protected ISA oracle failed to reject result mutation" >&2
            exit 1
          fi
          RECEIPT="$RECEIPT_DIR/rejected-isa-result.json" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RECEIPT));
          assert.equal(report.mutation,'result');
          assert.equal(report.status,'fail');
          assert.deepEqual(report.differences.map(d=>d.field),['result']);
          NODE
          node --test test/i8086-at-memory.test.mjs test/i8086-at-devices.test.mjs test/i8086-machine-protected-interrupts.test.mjs \
            | tee "$RECEIPT_DIR/i8086-at-memory-tests.log"
          node scripts/run-at-memory-guest.mjs \
            | tee "$RECEIPT_DIR/at-memory-guest.json"
          node scripts/run-at-devices-guest.mjs --out "$RECEIPT_DIR/at-devices-guest.json"
          for mutation in frame if restart; do
            if IDT_ORACLE_MUTATION="$mutation" node scripts/compare-pcjs-protected286-idt.mjs \
              > "$RECEIPT_DIR/rejected-$mutation.json"; then
              echo "IDT oracle failed to reject $mutation mutation" >&2
              exit 1
            fi
            MUTATION="$mutation" RECEIPT="$RECEIPT_DIR/rejected-$mutation.json" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RECEIPT));
          const expected=process.env.MUTATION === 'restart' ? 'generalProtection' : 'interruptGate';
          assert.equal(report.mutation,process.env.MUTATION);
          assert.equal(report.status,'fail');
          assert.equal(report.differences.length,1);
          assert.equal(report.differences[0].case,expected);
          NODE
          done
      - name: Upload the fresh protected-mode PCjs receipt
        if: ${{ always() && env.RECEIPT_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected286-pcjs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the fresh protected ISA PCjs receipt
        if: ${{ always() && env.RECEIPT_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected286-isa-pcjs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}/pcjs-protected286-isa.json
          if-no-files-found: error
          retention-days: 30

  sampled-386:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check out pinned physical 386EX samples
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
