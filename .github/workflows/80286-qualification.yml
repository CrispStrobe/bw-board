          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync(process.env.RECEIPT_DIR+"/context.json",JSON.stringify({schemaVersion:1,revision:process.env.GITHUB_SHA,dosRevision:"2d04cacc5322951f187bb17e017c12920ac8ebe2",node:process.version,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,claim:"functional wired DOS prompt on the reference net backend",timingGraded:false,physicalBoardGraded:false},null,2)+"\n",{flag:"wx"});'
          node scripts/probe-harris-dos.mjs 10000000 "$RECEIPT_DIR/wired-dos.json" \
            2> >(tee "$RECEIPT_DIR/wired-dos.progress.log" >&2) \
            | tee "$RECEIPT_DIR/wired-dos.stdout.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const r=JSON.parse(fs.readFileSync(process.env.RECEIPT_DIR+'/wired-dos.json'));
          assert.equal(r.accepted,true);
          assert.equal(r.outcome.status,'dos-prompt');
          assert.equal(r.bootSectorEntered,true);
          assert.equal(r.commandMatches,true);
          assert.equal(r.netBackend,'reference');
