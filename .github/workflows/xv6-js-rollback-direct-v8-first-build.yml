name: direct V8 first build (unloaded receipt)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: xv6-js-rollback-direct-v8-first-build-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  first-build:
    if: >-
      github.event.label.name == 'xv6-js-rollback-direct-v8-first-build' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - name: Admit exact unloaded first-build source and pure controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          evidence="$RUNNER_TEMP/direct-v8-first-build-evidence"
          mkdir -m 700 "$evidence"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$BW_EXPECTED_HEAD"
          timeout 120s git --no-replace-objects fetch --no-tags --depth 1 https://github.com/CrispStrobe/bw-board.git 174767b449b1be4b3e76f41c6e44ffd46ba2edfd
          git --no-replace-objects cat-file -e 174767b449b1be4b3e76f41c6e44ffd46ba2edfd^{commit}
          test -z "$(git --no-replace-objects status --porcelain=v1 -uall)"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-first-build/source-control.py > "$evidence/control.stdout" 2> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-first-build/control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-first-build/inventory-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8/header-budget-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8/preflight-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-first-build/source.py "$evidence/source.json" > "$evidence/source.stdout" 2> "$evidence/source.stderr"
      - name: Build pinned addon once and retain unloaded receipt
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          evidence="$RUNNER_TEMP/direct-v8-first-build-evidence"
          timeout 9m python3 -B scripts/xv6-js-rollback-direct-v8-first-build/run.py "$RUNNER_TEMP/direct-v8-first-build-work" "$evidence" > "$evidence/run.stdout" 2> "$evidence/run.stderr"
          python3 -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["schema"] == "bw.direct-v8.first-build.v1" and r["status"] == "BUILT_UNLOADED_UNQUALIFIED" and r["firstFailure"] is None and r["addon"]["loaded"] is False' "$evidence/first-build.json"
      - name: Admit closed report-only inventory
        id: inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-first-build/inventory.py "$RUNNER_TEMP/direct-v8-first-build-evidence"
      - name: Upload bounded original first build reports
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-v8-first-build-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-v8-first-build-evidence/
          if-no-files-found: error
          retention-days: 7
