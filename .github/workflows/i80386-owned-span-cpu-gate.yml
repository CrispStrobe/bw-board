name: Owned 386 private span paired CPU gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/i80386-owned-span-cpu-gate.yml'
      - 'scripts/owned-span-cpu-ci/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: owned-span-fixed-cpu-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  paired-cpu-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
      NODE_V8_COVERAGE: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 80d228ee5452f380655a16c4bc823beb76e781c1
          path: materializer-source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fe1eff2039520536350922a2164c8bbe29404c68
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch historical ROM admission source
        run: git -C baseline fetch --depth=1 origin 7df84bc2c367aff1cadec7cecdde69cf0e904ace
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Authenticate genuine three-cell qualification and materialize unchanged native build
        id: prepare
        env:
          BW_SPAN_CPU_PUBLICATION: ${{ github.workspace }}
          BW_SPAN_CPU_TOOLING: ${{ github.workspace }}/materializer-source
          BW_SPAN_COMPILED: ${{ github.workspace }}/baseline
          BW_SPAN_CPU_CONTEXT: ${{ runner.temp }}/owned-span-cpu
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BW_SPAN_CPU_CONTEXT"
          python3 scripts/owned-span-cpu-ci/prepare.py > "$BW_SPAN_CPU_CONTEXT/preparation.stdout" 2> "$BW_SPAN_CPU_CONTEXT/preparation.stderr"
      - name: One sequential 18-child paired process-CPU gate
        if: ${{ steps.prepare.outcome == 'success' }}
        env:
          BW_SPAN_CPU_PUBLICATION: ${{ github.workspace }}
          BW_SPAN_CPU_TOOLING: ${{ github.workspace }}/materializer-source
          BW_SPAN_CPU_CONTEXT: ${{ runner.temp }}/owned-span-cpu
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/owned-span-cpu-ci/run-gate.py > "$BW_SPAN_CPU_CONTEXT/gate.stdout" 2> "$BW_SPAN_CPU_CONTEXT/gate.stderr"
      - name: Retain every new actual child and orchestration success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-span-cpu-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owned-span-cpu/*.json
            ${{ runner.temp }}/owned-span-cpu/*.stdout
            ${{ runner.temp }}/owned-span-cpu/*.stderr
            ${{ runner.temp }}/owned-span-cpu/gate
            ${{ runner.temp }}/owned-span-cpu/materialization/*.json
            ${{ runner.temp }}/owned-span-cpu/materialization/*.stdout
            ${{ runner.temp }}/owned-span-cpu/materialization/*.stderr
            scripts/owned-span-cpu-ci
            .github/workflows/i80386-owned-span-cpu-gate.yml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
