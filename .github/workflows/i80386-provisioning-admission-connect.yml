name: i80386 provisioning admission connection controls
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/i80386-full-tree-provisioning-launcher/controller.py'
      - 'scripts/i80386-full-tree-provisioning-launcher/controller-controls.py'
      - 'scripts/i80386-full-tree-provisioning-launcher/CONTROLLER.md'
      - '.github/workflows/i80386-provisioning-admission-connect.yml'
permissions:
  contents: read
concurrency:
  group: provisioning-admission-connect-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  synthetic-controls:
    if: github.repository == 'CrispStrobe/bw-board' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'lane/386-provisioning-admission-connect-20261013' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/i80386-full-tree-provisioning-launcher
            scripts/i80386-unarmed-supervisor
            scripts/i80386-full-tree-profile-source
            scripts/i80386-full-tree-provisioner
            scripts/i80386-full-tree-archive-bridge
            scripts/i80386-djgpp-notice-extractor
            scripts/i80386-full-tree-notice-connection
      - name: Tiny source and orchestration fixtures only
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 30
          ulimit -v 524288
          ulimit -f 1024
          ulimit -n 256
          ulimit -c 0
          /usr/bin/timeout 45s /usr/bin/python3 -I -B scripts/i80386-full-tree-provisioning-launcher/controller-controls.py
