name: direct V8 tool roster (report only)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: xv6-js-rollback-direct-v8-tool-roster-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tool-roster:
    if: >-
      github.event.label.name == 'xv6-js-rollback-direct-v8-tool-roster' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - name: Admit exact report-only tool roster source and pure controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          evidence="$RUNNER_TEMP/direct-v8-tool-roster-evidence"
          mkdir -m 700 "$evidence"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$BW_EXPECTED_HEAD"
          timeout 120s git --no-replace-objects fetch --no-tags --depth 1 https://github.com/CrispStrobe/bw-board.git 8ffca01b8ca675fcd2a3980ffd0697665b080771
          git --no-replace-objects cat-file -e 8ffca01b8ca675fcd2a3980ffd0697665b080771^{commit}
          test -z "$(git --no-replace-objects status --porcelain=v1 -uall)"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-tool-roster/source-control.py > "$evidence/control.stdout" 2> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-tool-roster/control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-tool-roster/inventory-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8/header-budget-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8/preflight-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-tool-roster/source.py "$evidence/source.json" > "$evidence/source.stdout" 2> "$evidence/source.stderr"
      - name: Record hosted Node, headers and tool roster only
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          evidence="$RUNNER_TEMP/direct-v8-tool-roster-evidence"
          timeout 9m python3 -B scripts/xv6-js-rollback-direct-v8-tool-roster/run.py "$RUNNER_TEMP/direct-v8-tool-roster-work" "$evidence" > "$evidence/run.stdout" 2> "$evidence/run.stderr"
          python3 -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["schema"] == "bw.direct-v8.tool-roster.v1" and r["status"] == "TOOL_ROSTER_SPLIT_OUTPUT_UNQUALIFIED" and r["firstFailure"] is None' "$evidence/tool-roster.json"
      - name: Admit closed report-only inventory
        id: inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-tool-roster/inventory.py "$RUNNER_TEMP/direct-v8-tool-roster-evidence"
      - name: Upload bounded original tool roster reports
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-v8-tool-roster-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-v8-tool-roster-evidence/
          if-no-files-found: error
          retention-days: 7
