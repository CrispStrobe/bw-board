name: Ordinary JS 386 HDD export and reload
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hdd-export-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  controls:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Authored byte and capture controls only
        run: |
          set -euo pipefail
          python3 -B scripts/i80386-hdd-export/controls.py
          node --check scripts/i80386-hdd-export/probe.mjs
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/i80386-hdd-export/probe.py').read_text())"
  actual:
    if: github.run_attempt == 1 && github.repository == 'CrispStrobe/bw-board' && ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'x86-hdd-export-actual' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      UNIT: bw-hdd-export-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Fixed official free input and authored master staging
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -B scripts/i80386-hdd-export/probe.py --stage-floppy "$RUNNER_TEMP/hdd-export-floppy.img"
          node scripts/i80386-hdd-export/probe.mjs "$RUNNER_TEMP/hdd-export-session" "$RUNNER_TEMP/hdd-export-floppy.img" "$SOURCE_HEAD"
      - name: Own bounded unit and two fresh ordinary CLI sessions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BW_OFFICIAL_JOB_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.name == "actual" and .status == "in_progress")] | if length == 1 then .[0].id else error("sole actual job") end')
          export BW_OFFICIAL_JOB_ID
          CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          touch "$RUNNER_TEMP/hdd-export-unit-requested"
          UNIT_WAIT_RC=0
          sudo systemd-run --unit="$UNIT" --wait --collect --service-type=exec \
            --property="User=$(id -u)" --property="Group=$(id -g)" \
            --property=CPUQuota=100% --property=CPUQuotaPeriodSec=100ms \
            --property=MemoryMax=1G --property=MemorySwapMax=0 --property=TasksMax=64 \
            --property=RuntimeMaxSec=1250 --property=TimeoutStopSec=5 --property=KillMode=control-group \
            --working-directory="$RUNNER_TEMP/hdd-export-session" \
            --setenv="GITHUB_REPOSITORY=$GITHUB_REPOSITORY" --setenv="GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            --setenv="GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" --setenv="BW_OFFICIAL_JOB_ID=$BW_OFFICIAL_JOB_ID" \
            --setenv="RUNNER_NAME=$RUNNER_NAME" --setenv="ImageOS=$ImageOS" --setenv="ImageVersion=$ImageVersion" \
            /usr/bin/taskset -c "$CPU" /usr/bin/python3 -B source/scripts/i80386-hdd-export/probe.py \
            --run . --expected-head "$SOURCE_HEAD" \
            --media-review-sha256 93a1119016e7e9d2a963ce4491199698e852739f9d20b3b7b0f5fdfe10c41795 || UNIT_WAIT_RC=$?
          printf '%s\n' "$UNIT_WAIT_RC" > "$RUNNER_TEMP/hdd-export-unit-waited"
          test "$UNIT_WAIT_RC" = 0
      - name: Independent original-byte reported consistency
        run: |
          set -euo pipefail
          python3 -B scripts/i80386-hdd-export/reader.py --packet "$RUNNER_TEMP/hdd-export-session/originals"
      - name: Observe and finish only the owned unit
        if: always()
        run: |
          set -euo pipefail
          if ! test -f "$RUNNER_TEMP/hdd-export-unit-requested"; then
            echo 'owned-controller-not-requested; earlier staging did not complete'
            exit 0
          fi
          test -f "$RUNNER_TEMP/hdd-export-unit-waited"
          LIST=$(sudo systemctl list-units --all --plain --no-legend "$UNIT.service")
          if test -n "$LIST"; then
            BEFORE=$(sudo systemctl show "$UNIT.service" --property=Id,LoadState,ActiveState,SubState,Result,ControlGroup,MainPID)
            printf '%s\n' "$BEFORE"
            printf '%s\n' "$BEFORE" | /usr/bin/grep -qx "Id=$UNIT.service"
            CONTROL_GROUP=$(printf '%s\n' "$BEFORE" | /usr/bin/sed -n 's/^ControlGroup=//p')
            test -z "$CONTROL_GROUP" || test "$CONTROL_GROUP" = "/system.slice/$UNIT.service"
            sudo systemctl stop "$UNIT.service"
            LIST=$(sudo systemctl list-units --all --plain --no-legend "$UNIT.service")
            if test -n "$LIST"; then
              AFTER=$(sudo systemctl show "$UNIT.service" --property=Id,ActiveState,SubState,Result,ControlGroup,MainPID)
              printf '%s\n' "$AFTER"
              printf '%s\n' "$AFTER" | /usr/bin/grep -qx "Id=$UNIT.service"
              printf '%s\n' "$AFTER" | /usr/bin/grep -qx 'MainPID=0'
              printf '%s\n' "$AFTER" | /usr/bin/grep -Eq '^ActiveState=(inactive|failed)$'
            else
              echo 'owned-controller-unit=collected-after-stop'
            fi
          else
            echo 'owned-controller-unit=collected-after-wait'
          fi
          CG="/sys/fs/cgroup/system.slice/$UNIT.service"
          if test -d "$CG"; then
            test -z "$(cat "$CG/cgroup.procs")"
            printf '%s\n' 'owned-controller-cgroup=empty'
          else
            printf '%s\n' 'owned-controller-cgroup=absent'
          fi
          printf 'owned-controller-terminal unit=%s\n' "$UNIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ordinary-386-hdd-export-originals
          path: ${{ runner.temp }}/hdd-export-session/originals/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
