name: Fixed 8042 first native build and semantic cells

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/i80386-native-owned-8042-build.yml'
      - 'scripts/bochs-cpu3-native-owned-8042/**'
      - 'scripts/prepare-bochs-cpu3-native-owned-8042.mjs'
      - 'scripts/run-i80386-native-owned-8042.mjs'
      - 'scripts/ci-build-i80386-native-owned-8042.py'
      - 'test/i80386-native-owned-8042-*.test.mjs'

permissions:
  contents: read

concurrency:
  group: fixed-8042-first-build-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  fixed-8042:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: publication
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install and retain host context
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/fixed-8042-context"
          cp publication/.github/workflows/i80386-native-owned-8042-build.yml "$RUNNER_TEMP/fixed-8042-context/workflow.yml"
          cp publication/scripts/ci-build-i80386-native-owned-8042.py "$RUNNER_TEMP/fixed-8042-context/build-helper.py"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libltdl-dev libnode-dev
          test -r /usr/include/node/node_api.h
          {
            git -C publication rev-parse HEAD
            node --version
            sha256sum "$(command -v node)" /usr/include/node/node_api.h
            dpkg-query -W build-essential g++ libc6-dev libltdl-dev libnode-dev
            g++ --version
            uname -a
            lscpu
            df -h "$RUNNER_TEMP"
            printf 'run=%s attempt=%s event=%s expected_head=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$BW_EXPECTED_HEAD"
          } > "$RUNNER_TEMP/fixed-8042-context/context.txt"
      - name: Fetch pinned pristine Bochs
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/fixed-8042-pristine"
          git -C "$RUNNER_TEMP/fixed-8042-pristine" remote add origin https://github.com/bochs-emu/Bochs.git
          git -C "$RUNNER_TEMP/fixed-8042-pristine" fetch --depth=1 --no-tags origin 0e45b736ef9792eb9b752b0a35db49eaf2faea47
          git -C "$RUNNER_TEMP/fixed-8042-pristine" checkout --detach FETCH_HEAD
      - name: First build, source admission and two bounded native cells
        shell: bash
        run: |
          set -euo pipefail
          python3 publication/scripts/ci-build-i80386-native-owned-8042.py \
            "$GITHUB_WORKSPACE/publication" \
            "$RUNNER_TEMP/fixed-8042-evidence" \
            "$RUNNER_TEMP/fixed-8042-prepared" \
            "$RUNNER_TEMP/fixed-8042-pristine" \
            > "$RUNNER_TEMP/fixed-8042-context/parent.stdout" \
            2> "$RUNNER_TEMP/fixed-8042-context/parent.stderr"
      - name: Retain raw build, source, captures and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-8042-first-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fixed-8042-context
            ${{ runner.temp }}/fixed-8042-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
