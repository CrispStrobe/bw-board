name: i80386 supervisor outer boundary controls
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/i80386-supervisor-outer-boundary/**'
      - '.github/workflows/i80386-supervisor-outer-boundary.yml'
permissions:
  contents: read
concurrency:
  group: supervisor-outer-boundary-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  synthetic-controls:
    if: github.repository == 'CrispStrobe/bw-board' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'lane/386-supervisor-outer-boundary-20261013' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: scripts/i80386-supervisor-outer-boundary
      - name: Pure manufactured controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 30
          ulimit -v 524288
          ulimit -f 1024
          ulimit -n 256
          ulimit -c 0
          /usr/bin/timeout 45s /usr/bin/python3 -I -B scripts/i80386-supervisor-outer-boundary/controls.py
      - name: Fixed hosted namespace fixtures
        if: github.event.pull_request.head.sha == '80a19c789b350be3a10bf3443f14a3fb34e948b3'
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 30
          ulimit -v 524288
          ulimit -f 1024
          ulimit -n 256
          ulimit -c 0
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin GITHUB_ACTIONS=true /usr/bin/timeout --signal=KILL 45s /usr/bin/python3 -I -B scripts/i80386-supervisor-outer-boundary/hosted-controls.py
      - name: Retain bounded original synthetic output
        if: always() && github.event.pull_request.head.sha == '80a19c789b350be3a10bf3443f14a3fb34e948b3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supervisor-outer-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: outer-boundary-results/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
