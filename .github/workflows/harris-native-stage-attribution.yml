name: Harris native exact-stage attribution

on:
  push:
    branches: ['perf/native-stage-attribution', 'perf/native-stage-attribution-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare exact promoted control
        run: |
          set -euo pipefail
          MASTER_SHA=fa1b648b25b1205201b4eba4fbeb5d7a3f6d629b
          CANDIDATE_SHA=$GITHUB_SHA
          git cat-file -e "$MASTER_SHA^{commit}"
          git merge-base --is-ancestor "$MASTER_SHA" "$CANDIDATE_SHA"
          RECEIPT_DIR=$(mktemp -d "$RUNNER_TEMP/harris-native-stage-attribution.XXXXXX")
          TREE_DIR=$(mktemp -d "$RUNNER_TEMP/harris-native-stage-trees.XXXXXX")
          MASTER_TREE="$TREE_DIR/master"
          git worktree add --detach "$MASTER_TREE" "$MASTER_SHA"
          test "$(git -C "$MASTER_TREE" rev-parse HEAD)" = "$MASTER_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          if ! command -v clang >/dev/null || ! command -v wasm-ld >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y clang lld
          fi
          {
            echo "MASTER_SHA=$MASTER_SHA"
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "MASTER_TREE=$MASTER_TREE"
            echo "RECEIPT_DIR=$RECEIPT_DIR"
            echo "CLANG=$(command -v clang)"
            echo "WASM_LD=$(command -v wasm-ld)"
          } >> "$GITHUB_ENV"
      - name: Build production control, counter timing, and named profile modes
        run: |
          set -euo pipefail
          mkdir "$RECEIPT_DIR/master-build" "$RECEIPT_DIR/diagnostic-off-build" "$RECEIPT_DIR/counter-on-build" "$RECEIPT_DIR/named-profile-build"
          node "$MASTER_TREE/scripts/build-wired-net-kernel.mjs" "$RECEIPT_DIR/master-build" | tee "$RECEIPT_DIR/master-build.log"
          node scripts/build-wired-net-kernel.mjs "$RECEIPT_DIR/diagnostic-off-build" | tee "$RECEIPT_DIR/diagnostic-off-build.log"
          NATIVE_STAGE_ATTRIBUTION=1 node scripts/build-wired-net-kernel.mjs "$RECEIPT_DIR/counter-on-build" | tee "$RECEIPT_DIR/counter-on-build.log"
          NATIVE_STAGE_PROFILE_NAMING=1 node scripts/build-wired-net-kernel.mjs "$RECEIPT_DIR/named-profile-build" | tee "$RECEIPT_DIR/named-profile-build.log"
      - name: Verify diagnostics-off keeps the production executable shape
        run: |
          set -euo pipefail
          cmp "$RECEIPT_DIR/master-build/wired-net-kernel.wasm" "$RECEIPT_DIR/diagnostic-off-build/wired-net-kernel.wasm"
          cmp "$MASTER_TREE/src/experimental/wired-kernel/bus-circuit-image.js" "src/experimental/wired-kernel/bus-circuit-image.js"
      - name: Measure uninstrumented control separately from profiling
        run: |
          set -euo pipefail
          node --expose-gc scripts/measure-harris-native-stage-attribution.mjs --experimental \
            --master-dir="$MASTER_TREE" --candidate-dir="$GITHUB_WORKSPACE" \
            --master-wasm="$RECEIPT_DIR/master-build/wired-net-kernel.wasm" \
            --off-wasm="$RECEIPT_DIR/diagnostic-off-build/wired-net-kernel.wasm" \
            --counter-wasm="$RECEIPT_DIR/counter-on-build/wired-net-kernel.wasm" \
            --profile-wasm="$RECEIPT_DIR/named-profile-build/wired-net-kernel.wasm" \
            --candidate-revision="$CANDIDATE_SHA" --iterations=4096 --warmup-rounds=4 --rounds=12 \
            > "$RECEIPT_DIR/native-stage-attribution-control.json"
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const r=JSON.parse(fs.readFileSync(process.env.RECEIPT_DIR+"/native-stage-attribution-control.json"));assert.equal(r.measurementRevision,process.env.CANDIDATE_SHA);assert.equal(r.variants.master.revision,process.env.MASTER_SHA);assert.deepEqual([r.variants.diagnosticOff.stageAttribution,r.variants.diagnosticOff.stageProfileNames],[false,false]);assert.deepEqual([r.variants.nativeCounter.stageAttribution,r.variants.nativeCounter.jsStageAttribution,r.variants.nativeCounter.stageProfileNames],[true,false,false]);assert.deepEqual([r.variants.combinedCounter.stageAttribution,r.variants.combinedCounter.jsStageAttribution,r.variants.combinedCounter.stageProfileNames],[true,true,false]);assert.equal(r.variants.nativeCounter.wasmSHA256,r.variants.combinedCounter.wasmSHA256);assert.equal(r.warmups.length,16);assert.equal(r.samples.length,48);assert.equal(r.accepted,true);assert.ok(r.ratios.candidateOffToMaster>=.98&&r.ratios.candidateOffToMaster<=1.02);assert.ok(r.ratios.combinedCounterToOff>=.98&&r.ratios.combinedCounterToOff<=1.02);assert.ok(Number.isFinite(r.ratios.nativeCounterToOff)&&r.ratios.nativeCounterToOff>0);assert.ok(Number.isFinite(r.ratios.combinedCounterToNative)&&r.ratios.combinedCounterToNative>0);assert.equal(Object.keys(r.expected.work).length,12);'
      - name: Profile diagnostic mode in a separate process
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            node --expose-gc --cpu-prof --cpu-prof-dir="$RECEIPT_DIR" --cpu-prof-name="hybrid-native-stages-$run.cpuprofile" \
              scripts/measure-harris-native-stage-attribution.mjs --experimental --profile-only \
              --master-dir="$MASTER_TREE" --candidate-dir="$GITHUB_WORKSPACE" \
              --master-wasm="$RECEIPT_DIR/master-build/wired-net-kernel.wasm" \
              --off-wasm="$RECEIPT_DIR/diagnostic-off-build/wired-net-kernel.wasm" \
              --counter-wasm="$RECEIPT_DIR/counter-on-build/wired-net-kernel.wasm" \
              --profile-wasm="$RECEIPT_DIR/named-profile-build/wired-net-kernel.wasm" \
              --candidate-revision="$CANDIDATE_SHA" --iterations=4096 --profile-repetitions=8 \
              > "$RECEIPT_DIR/native-stage-profile-receipt-$run.json"
            node scripts/measure-harris-native-stage-attribution.mjs \
              --classify-profile="$RECEIPT_DIR/hybrid-native-stages-$run.cpuprofile" \
              --profile-receipt="$RECEIPT_DIR/native-stage-profile-receipt-$run.json" \
              > "$RECEIPT_DIR/native-stage-profile-classification-$run.json"
          done
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const d=process.env.RECEIPT_DIR,read=name=>JSON.parse(fs.readFileSync(d+"/"+name)),control=read("native-stage-attribution-control.json"),runs=[1,2,3].map(i=>read(`native-stage-profile-classification-${i}.json`));for(const r of runs){assert.deepEqual([r.profileReceipt.variant.stageAttribution,r.profileReceipt.variant.jsStageAttribution,r.profileReceipt.variant.stageProfileNames],[false,false,true]);assert.deepEqual(r.profileReceipt.expected,control.expected);const c=r.classification;assert.ok(c.nonIdleSamples>0);assert.ok(c.classifiedRatio>=.90);assert.ok(c.actionableRatio>=.70);assert.equal(c.topTwoActionable.length,2);assert.ok(c.topTwoActionable.every(x=>x.samples>=50&&x.shareOfNonIdle>=.10));assert.ok(c.topTwoCombinedShare>=.25);}assert.deepEqual(runs[1].classification.topTwoActionableFamilies,runs[0].classification.topTwoActionableFamilies);assert.deepEqual(runs[2].classification.topTwoActionableFamilies,runs[0].classification.topTwoActionableFamilies);'
      - name: Inventory every evidence payload before upload
        if: ${{ always() && env.RECEIPT_DIR != '' }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs";import path from "node:path";import assert from "node:assert/strict";import {createHash} from "node:crypto";const root=process.env.RECEIPT_DIR,expected=["master-build.log","diagnostic-off-build.log","counter-on-build.log","named-profile-build.log",...["master","diagnostic-off","counter-on","named-profile"].flatMap(n=>[`${n}-build/wired-net-kernel-build.json`,`${n}-build/wired-net-kernel.wasm`]),"native-stage-attribution-control.json",...Array.from({length:3},(_,i)=>[`native-stage-profile-receipt-${i+1}.json`,`hybrid-native-stages-${i+1}.cpuprofile`,`native-stage-profile-classification-${i+1}.json`]).flat()].sort();const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>{const p=path.join(dir,e.name);return e.isDirectory()?walk(p):[path.relative(root,p)]});const actual=walk(root).sort(),missing=expected.filter(name=>!actual.includes(name)),unexpected=actual.filter(name=>!expected.includes(name));const files=Object.fromEntries(actual.map(name=>{const bytes=fs.readFileSync(path.join(root,name));return [name,{size:bytes.length,sha256:createHash("sha256").update(bytes).digest("hex")}]}));fs.writeFileSync(path.join(root,"artifact-manifest.json"),JSON.stringify({schemaVersion:1,selfExcluded:"artifact-manifest.json",expected,actual,missing,unexpected,files},null,2)+"\n",{flag:"wx"});assert.deepEqual(missing,[]);assert.deepEqual(unexpected,[]);for(const value of Object.values(files)){assert.ok(value.size>0);assert.match(value.sha256,/^[0-9a-f]{64}$/);}'
      - name: Upload exact control, profile, counters, and byte receipts
        if: ${{ always() && env.RECEIPT_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harris-native-stage-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 14
