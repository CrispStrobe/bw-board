name: Cold BIOS plain JS versus copied typed-state paired timing
on:
  workflow_dispatch:
    inputs:
      enable_pairs:
        type: boolean
        default: false
        required: true
        description: Enable one separately reviewed 18-child plain-JS-versus-typed comparison
permissions:
  contents: read
  actions: read
concurrency:
  group: cold-typed-paired-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plain-v-typed-batched:
    if: ${{ inputs.enable_pairs == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
      NODE_V8_COVERAGE: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: runtime
          persist-credentials: false
      - name: Admit closed source and emit exact checkout roles
        id: roles
        run: |
          python3 -B runtime/scripts/cold-typed-state-paired/emit-roles.py >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.roles.outputs.compiled }}
          path: publication
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.roles.outputs.compiledFiles }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.roles.outputs.driver }}
          path: driver
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.roles.outputs.driverFiles }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.roles.outputs.native }}
          path: typed-worker
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.roles.outputs.nativeFiles }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.roles.outputs.qualifier }}
          path: qualifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.roles.outputs.qualifierFiles }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.roles.outputs.plainJs }}
          path: plain-worker
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.roles.outputs.plainJsFiles }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: One reviewed paired comparison, no semantic rerun or rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export BW_COLD_NODE="$(command -v node)"
          mkdir "$RUNNER_TEMP/cold-typed-paired-parent"
          python3 -B runtime/scripts/cold-typed-state-paired/hosted.py plain-JS-v-typed-batched "$RUNNER_TEMP/cold-typed-paired" > "$RUNNER_TEMP/cold-typed-paired-parent/stdout" 2> "$RUNNER_TEMP/cold-typed-paired-parent/stderr"
      - name: Preserve first outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-typed-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cold-typed-paired
            ${{ runner.temp }}/cold-typed-paired-parent
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
