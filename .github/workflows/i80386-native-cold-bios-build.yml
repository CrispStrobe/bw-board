name: Cold BIOS native build and static admission only

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/i80386-native-cold-bios-build.yml'
      - 'scripts/ci-build-i80386-native-cold-bios.py'
      - 'scripts/bochs-cpu3-native-cold-bios/runtime.mjs'
      - 'scripts/bochs-cpu3-native-cold-bios/rom-data-policy.mjs'
      - 'test/i80386-cold-bios-runtime-source.test.mjs'

permissions:
  contents: read

concurrency:
  group: cold-bios-build-only-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  cold-bios-build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
      NODE_V8_COVERAGE: ''
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: publication
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install and retain static build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cold-bios-build-context"
          cp publication/.github/workflows/i80386-native-cold-bios-build.yml "$RUNNER_TEMP/cold-bios-build-context/workflow.yml"
          cp publication/scripts/ci-build-i80386-native-cold-bios.py "$RUNNER_TEMP/cold-bios-build-context/build-helper.py"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libltdl-dev libnode-dev
          test -r /usr/include/node/node_api.h
          {
            git -C publication rev-parse HEAD
            node --version
            sha256sum "$(command -v node)" /usr/include/node/node_api.h
            dpkg-query -W build-essential g++ libc6-dev libltdl-dev libnode-dev
            g++ --version
            uname -a
            lscpu
            df -h "$RUNNER_TEMP"
            printf 'run=%s attempt=%s event=%s expected_head=%s scope=BUILD_ONLY_NO_ADDON_LOAD_OR_GUEST\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$BW_EXPECTED_HEAD"
          } > "$RUNNER_TEMP/cold-bios-build-context/context.txt"
      - name: Fetch exact pristine Bochs
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/cold-bios-build-pristine"
          git -C "$RUNNER_TEMP/cold-bios-build-pristine" remote add origin https://github.com/bochs-emu/Bochs.git
          git -C "$RUNNER_TEMP/cold-bios-build-pristine" fetch --depth=1 --no-tags origin 0e45b736ef9792eb9b752b0a35db49eaf2faea47
          git -C "$RUNNER_TEMP/cold-bios-build-pristine" checkout --detach FETCH_HEAD
      - name: Prepare, compile and authenticate static artifact only
        shell: bash
        run: |
          set -euo pipefail
          python3 publication/scripts/ci-build-i80386-native-cold-bios.py \
            "$GITHUB_WORKSPACE/publication" \
            "$RUNNER_TEMP/cold-bios-build-evidence" \
            "$RUNNER_TEMP/cold-bios-build-prepared" \
            "$RUNNER_TEMP/cold-bios-build-pristine" \
            > "$RUNNER_TEMP/cold-bios-build-context/parent.stdout" \
            2> "$RUNNER_TEMP/cold-bios-build-context/parent.stderr"
      - name: Retain complete build and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cold-bios-build-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cold-bios-build-context
            ${{ runner.temp }}/cold-bios-build-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
