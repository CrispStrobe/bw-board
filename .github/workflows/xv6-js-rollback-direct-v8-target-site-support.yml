name: direct V8 target-site four-case support

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: xv6-js-rollback-direct-v8-target-site-support-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  target-site-support:
    if: >-
      github.event.label.name == 'xv6-js-v8-target-site-support' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - name: Admit exact four-case support source and pure controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          evidence="$RUNNER_TEMP/direct-v8-target-site-support-evidence"
          mkdir -m 700 "$evidence"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$BW_EXPECTED_HEAD"
          timeout 120s git --no-replace-objects fetch --no-tags --depth 1 https://github.com/CrispStrobe/bw-board.git 9367cfa9a8f6ffaaee2afaa59be4735e6b494aad
          git --no-replace-objects cat-file -e 9367cfa9a8f6ffaaee2afaa59be4735e6b494aad^{commit}
          test -z "$(git --no-replace-objects status --porcelain=v1 -uall)"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-target-site-support/source-control.py > "$evidence/control.stdout" 2> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-target-site-support/grade-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-target-site-support/control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-target-site-support/inventory-control.py >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          node_bin="$(command -v node)"
          test -x "$node_bin"
          timeout 30s env -i PATH=/usr/bin:/bin TMPDIR="$RUNNER_TEMP" LANG=C LC_ALL=C TZ=UTC NODE_OPTIONS= NODE_PATH= LD_PRELOAD= LD_AUDIT= "$node_bin" scripts/xv6-js-rollback-direct-v8-target-site/control.mjs >> "$evidence/control.stdout" 2>> "$evidence/control.stderr"
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-target-site-support/source.py "$evidence/source.json" > "$evidence/source.stdout" 2> "$evidence/source.stderr"
      - name: Build and run four fresh support cases
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          evidence="$RUNNER_TEMP/direct-v8-target-site-support-evidence"
          timeout 23m python3 -B scripts/xv6-js-rollback-direct-v8-target-site-support/run.py "$RUNNER_TEMP/direct-v8-target-site-support-work" "$evidence" > "$evidence/run.stdout" 2> "$evidence/run.stderr"
          python3 -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["schema"] == "bw.direct-v8.target-site-support.v1" and r["status"] == "FOUR_CASE_TARGET_SITE_SUPPORT_ONLY" and r["firstFailure"] is None and r["support"]["supported"] is True and len(r["cases"]) == 4' "$evidence/target-site-support.json"
      - name: Admit closed report-only inventory
        id: inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 30s python3 -B scripts/xv6-js-rollback-direct-v8-target-site-support/inventory.py "$RUNNER_TEMP/direct-v8-target-site-support-evidence"
      - name: Upload bounded original support reports
        if: always() && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-v8-target-site-support-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-v8-target-site-support-evidence/
          if-no-files-found: error
          retention-days: 7
