# Build the labwired-wasm artifact the heavy simulation tier runs on, and
# publish it as a release asset lite fetches with a sha256 pin.
#
# WHY THIS IS CI AND NOT A LAPTOP
# --------------------------------
# The build is ~10 minutes of Rust for a 20 MB artifact, and the property we
# actually need from it — that two independent builds agree byte for byte — is
# one a developer machine is BAD at proving. Every difference chased locally
# turned out to be an artifact of the machine: a per-process temp dir, macOS's
# /var -> /private/var symlink, a $HOME/.cargo that was itself a symlink to
# external storage. Two clean runners with identical paths remove that whole
# class, and they do it in parallel while nobody waits.
#
# The `determinism` job is the point, not decoration: if the two legs disagree,
# the sha256 in lite's sync-labwired-wasm.mjs is a fingerprint of one machine
# rather than a checkable claim, and we want to know that before publishing.
name: labwired-wasm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'labwired-core commit to build (40-hex). Default: the script PIN.'
        type: string
        default: ''
      publish:
        description: 'Publish a release asset (otherwise build + verify only)'
        type: boolean
        default: false
      rev:
        description: 'Rebuild revision suffix (e.g. r2). A published asset is pinned by sha256 downstream and must never be replaced under its own name, so a rebuild of the same ref gets a new tag.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Two INDEPENDENT builds. Same paths (clean runners), different machines:
      # exactly the comparison that is hard to arrange locally.
      matrix:
        leg: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Only to put `rustup` on PATH. The toolchain that actually builds is
      # labwired's own: their rust-toolchain.toml pins 1.95.0, and the build
      # script adds wasm32 to THAT one from inside the checkout. Installing
      # wasm32 for `stable` here would be theatre — the first run failed with
      # `can't find crate for core` doing exactly that.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head, 2026-08-24
        with:
          toolchain: stable

      - name: Build
        run: |
          ARGS=""
          if [ -n "${{ inputs.ref }}" ]; then ARGS="--ref ${{ inputs.ref }}"; fi
          node scripts/build-labwired-wasm.mjs --out "$RUNNER_TEMP/out" $ARGS

      - name: Report what came out
        run: cat "$RUNNER_TEMP/out/BUILD-INFO.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: labwired-wasm-${{ matrix.leg }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7

  determinism:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: labwired-wasm-a, path: a }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: labwired-wasm-b, path: b }
      - name: Two independent builds must agree byte for byte
        run: |
          set -euo pipefail
          fail=0
          # Walk what is THERE rather than a hardcoded list. The list went stale
          # the moment the layout grew nodejs/ and web/ subdirectories, and the
          # job failed on a missing path instead of on a real difference —
          # a gate that breaks when the thing it guards changes shape is a gate
          # nobody will trust the next time it goes red.
          files=$(cd a && find . -type f \( -name '*.js' -o -name '*.wasm' \) | sort)
          [ -n "$files" ] || { echo "::error::no build outputs to compare"; exit 1; }
          echo "comparing:"; echo "$files" | sed 's/^/    /'
          for f in $files; do
            ha=$(sha256sum "a/$f" | cut -d' ' -f1)
            hb=$(sha256sum "b/$f" | cut -d' ' -f1)
            if [ "$ha" = "$hb" ]; then
              echo "ok    $f  $ha"
            else
              echo "::error::$f differs between two independent builds: $ha vs $hb"
              # Say HOW MUCH, so a 5-byte path embed is not mistaken for a
              # rebuild of the whole module. This is how the local rounds were
              # diagnosed, and it is the first question anyone will ask.
              cmp -l "a/$f" "b/$f" | wc -l | xargs echo "  differing bytes:"
              fail=1
            fi
          done
          exit $fail

  # The artifact is only worth publishing if it RUNS. This is the same suite
  # that is gated on LABWIRED_WASM locally, pointed at what CI just built — so
  # "the build succeeded" and "the engine works" stop being the same claim.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: labwired-wasm-a, path: lw }
      # The suite reaches the factory, which imports the avr8js and rp2040js
      # adapters, so the repo's own deps have to be here. The first run of this
      # job died on `Cannot find package 'avr8js'` — the build jobs never need
      # node_modules, so it was easy to forget the test job does.
      - name: Install dependencies
        run: npm ci || npm install

      - name: ARM toolchain (the tests build a real F0 ELF)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi
      - name: Adapter + debug-target contract, against the freshly built engine
        env:
          LABWIRED_WASM: ${{ github.workspace }}/lw/nodejs
        run: |
          set -euo pipefail
          node --test test/labwired-adapter.test.mjs 2>&1 | tee out.txt
          # A suite that SKIPS is not a suite that passes, and this one skips
          # itself whenever LABWIRED_WASM or the ARM toolchain is missing —
          # which in this job would mean the wiring broke, not that there is
          # nothing to check.
          grep -q '^# skipped 0' out.txt || { echo "::error::the labwired suite skipped — LABWIRED_WASM or arm-none-eabi-gcc did not reach it"; exit 1; }

  publish:
    needs: [determinism, test]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: labwired-wasm-a, path: out }
      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF=$(node -e "console.log(require('./out/BUILD-INFO.json').ref)")
          TAG="labwired-wasm-${REF:0:8}${{ inputs.rev && format('-{0}', inputs.rev) || '' }}"
          echo "publishing $TAG"
          # Immutable by construction: the tag names the SOURCE commit, and the
          # release notes carry the sha256s lite pins. Re-running for the same
          # ref is refused rather than silently replacing the asset a pin trusts.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. A published asset is pinned by sha256 downstream; replacing it would break that pin silently. Delete it deliberately, or build a different ref."
            exit 1
          fi
          {
            echo "labwired-wasm built from labwired-core @ \`$REF\`."
            echo
            echo "Reproduced by two independent CI builds (see the determinism job)."
            echo
            echo '```'
            cat out/BUILD-INFO.json
            echo '```'
          } > notes.md
          # A release's assets are one flat namespace, so the target is part of
          # the name. Without that the two glues collide and whichever uploads
          # last wins — silently, and only one of them works in a browser.
          mkdir -p flat
          cp out/BUILD-INFO.json flat/
          for t in nodejs web; do
            for f in out/$t/*.js out/$t/*.wasm; do
              [ -e "$f" ] || continue
              cp "$f" "flat/$t-$(basename "$f")"
            done
          done
          ls -l flat
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "labwired-wasm @ ${REF:0:8}" --notes-file notes.md \
            flat/*
