name: CI
on:
  push:
    # Feature branches build too, so a change can be verified on a clean
    # machine BEFORE it reaches master. A full local run on a developer box
    # measures the developer's other processes as much as the code — the
    # setPin budget in test/perf-budget.test.js goes red under a concurrent
    # suite and passes alone, which is the whole reason that budget had to
    # be re-derived.
    branches: [master, main, 'fable/**', 'wip/**']
  pull_request:
  # The heavy vector suites are ground nightly rather than per push: the
  # z80 suite unpacks to 1.6 GB and the 65x02 to a comparable size, which is
  # a real download on every feature-branch commit for evidence that changes
  # only when a CPU core does. Nightly plus on-demand, and the census step in
  # the fast job means nobody can mistake "not run today" for "passing".
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # emu8051-stc is a public MIT sibling, and test/emu8051-idle-fastforward
      # needs its built WASM. Checking it out is the difference between that
      # gate RUNNING and it skipping on every CI run — the failure mode this
      # project has already paid for once, where fifteen cross-repo tests
      # skipped silently for weeks and a skip reads the same as a pass in the
      # summary line. Pinned, so this repo's verdict does not float with
      # another repo's HEAD.
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/emu8051-stc
          ref: e473e906c1a8db9a50e5b70ef42171e79a0de372
          # Actions refuses a path outside the workspace, so the sibling lands
          # INSIDE it and the test looks in both places.
          path: emu8051-stc
      # Emscripten's MODULARIZE output is CommonJS, but a `.js` file inside
      # this repo — whose package.json says "type": "module" — is parsed as
      # ESM by Node whichever loader is used, so the factory comes back
      # undefined. Beside the repo there is no package.json above it and it
      # loads fine, which is why every local run was green while CI was red
      # with "createEmu8051 is not a function". The marker makes the two
      # layouts equivalent.
      - name: Mark the emulator build as CommonJS
        run: echo '{"type":"commonjs"}' > emu8051-stc/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        # The 65x02 and z80 vector-suite tests skip cleanly when their suites
        # are not cloned, and so does test/moo.test.mjs. That is a real hole
        # and it is not papered over here — the `vectors` job below closes it
        # for the 8086 by checking the suite out and grinding all 646,000. The
        # other two CPUs still have no such job; when one is added it belongs
        # beside it, not in this comment.
        run: npm test

      # WHICH ORACLES DID NOT RUN. `npm test` above reports its skips, and in
      # that list "a CPU core's hardware-generated vectors did not run" looks
      # exactly like "no Playwright". This names them, so an absent oracle is
      # a line a reader sees rather than one of forty-two skips. Informational
      # here by design — most of these inputs are not obtainable on a runner
      # and their absence is a stated limit, not a failure.
      - name: Which oracles are present
        run: node scripts/oracle-census.mjs

  # ---------------------------------------------------------------------
  # The 8086 vector grind, which until now ran nowhere but a developer's box.
  #
  # `npm test` above says the vector-suite tests "skip cleanly when the suites
  # are not cloned". That is true and it is the problem: the 8086 core and
  # disassembler are each claimed at 646,000/646,000, the sampled grind in
  # test/i8086.test.mjs is the only thing in the suite that would notice
  # otherwise, and it skips on every runner. A skip reads the same as a pass in
  # a summary line — which is the exact failure the emu8051-stc checkout above
  # was added to fix, and it was sitting one job away the whole time.
  #
  # WHY THIS IS AFFORDABLE. The suite ships the same 646,000 vectors twice:
  # `v1/` as gzipped JSON and `v1_binary/` as gzipped MOO. Checking out the
  # binary form is 94 MB against 174 MB and parses without materialising
  # 646,000 objects. `v1/metadata.json` comes with it because the undefined-
  # flag masks live there, and three `v1/*.json.gz` because the reader itself
  # has to be proved: test/moo.test.mjs requires the two encodings to agree
  # field for field, which is what stops a reader that silently returns empty
  # vectors from reporting 646,000/646,000 while examining nothing.
  #
  # A separate job, because it is slower than the unit suite and its verdict
  # is about the CORE rather than about the board. Pinned, so this repo's
  # verdict does not float with another repo's HEAD.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SingleStepTests/8086
          ref: e71c68d215a6bb8c356bd4cb3842de3bef345ca9
          path: 8086-vectors
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /v1_binary/
            /v1/metadata.json
            /v1/00.json.gz
            /v1/8F.json.gz
            /v1/D0.6.json.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund

      # Prove the checkout BEFORE trusting anything that reads it. A sparse
      # pattern that matched nothing produces an empty directory, and every
      # step after it would then be measuring absence.
      - name: The vectors are actually here
        env:
          I8086_VECTORS: ${{ github.workspace }}/8086-vectors
        run: |
          set -euo pipefail
          n=$(ls "$I8086_VECTORS/v1_binary" | grep -c '\.MOO\.gz$')
          echo "$n MOO files"
          test "$n" -eq 323
          test -f "$I8086_VECTORS/v1/metadata.json"
          du -sh "$I8086_VECTORS"

      # The reader, against the encoding it replaces. This must run BEFORE the
      # grinds: they consume its output, so a grind that passes on a broken
      # reader proves only that the reader agrees with itself.
      - name: MOO reader agrees with the JSON encoding
        env:
          I8086_VECTORS: ${{ github.workspace }}/8086-vectors
        run: node --test test/moo.test.mjs

      - name: 8086 core — all 646,000 vectors
        env:
          I8086_VECTORS: ${{ github.workspace }}/8086-vectors
        run: node scripts/grind-i8086.mjs

      - name: 8086 disassembler — all 646,000, on text and length
        env:
          I8086_VECTORS: ${{ github.workspace }}/8086-vectors
        run: node scripts/grind-i8086-disasm.mjs

  # ---------------------------------------------------------------------
  # The 80186 variant, graded against a DIFFERENT CHIP -- and that is the
  # point of this job rather than a caveat on it.
  #
  # There is no hardware-generated 80186 test suite and there is unlikely ever
  # to be one. The NEC V20 implements the 186's additions with the same
  # encodings, so SingleStepTests/v20 grades those and nothing else. Where the
  # V20 stops being a 186 the grinders EXCLUDE and PRINT the count rather than
  # scoring the wrong chip: 39,898 vectors whose shift count exceeds 31 (the
  # V20 does not mask and a 186 does -- measured, not assumed) and 3,570
  # REPC/REPNC vectors (NEC prefixes with no 186 equivalent, identified by
  # their BYTES and cross-checked against their names, so an exclusion that
  # quietly widens fails the run instead of looking like a pass).
  #
  # WHY THIS IS AFFORDABLE. The full suite is 851 MB. Fifteen opcodes are 156,
  # so only those files are checked out -- the same pinned-sparse idiom the
  # `vectors` job above uses, at the same kind of cost.
  #
  # What this job does NOT prove is stated so nobody reads it as more: the
  # shift-count masking and reg=6-as-SHL are the two places a 186 differs from
  # an 8086 on an instruction BOTH have, and the V20 sides with the 8086 on
  # both. Those rest on test/i8086-186.test.mjs, which runs in the main suite.
  vectors186:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SingleStepTests/v20
          ref: 9efbd02b8ec1a3aad347c2b59672ad25f3bcdb21
          path: v20-vectors
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /v1_native/metadata.json
            /v1_native/60.json.gz
            /v1_native/61.json.gz
            /v1_native/62.json.gz
            /v1_native/68.json.gz
            /v1_native/69.json.gz
            /v1_native/6A.json.gz
            /v1_native/6B.json.gz
            /v1_native/6C.json.gz
            /v1_native/6D.json.gz
            /v1_native/6E.json.gz
            /v1_native/6F.json.gz
            /v1_native/C8.json.gz
            /v1_native/C9.json.gz
            /v1_native/C0.0.json.gz
            /v1_native/C0.1.json.gz
            /v1_native/C0.2.json.gz
            /v1_native/C0.3.json.gz
            /v1_native/C0.4.json.gz
            /v1_native/C0.5.json.gz
            /v1_native/C0.6.json.gz
            /v1_native/C0.7.json.gz
            /v1_native/C1.0.json.gz
            /v1_native/C1.1.json.gz
            /v1_native/C1.2.json.gz
            /v1_native/C1.3.json.gz
            /v1_native/C1.4.json.gz
            /v1_native/C1.5.json.gz
            /v1_native/C1.6.json.gz
            /v1_native/C1.7.json.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund

      # Prove the checkout BEFORE trusting anything that reads it. A sparse
      # pattern that matched nothing produces an empty directory, and both
      # grinds below would then report a perfect score for examining nothing.
      # Their own zero-vectors assertion catches that too; this catches it
      # earlier and says which half is missing.
      - name: The v20 vectors are actually here
        env:
          V20_VECTORS: ${{ github.workspace }}/v20-vectors
        run: |
          set -euo pipefail
          n=$(ls "$V20_VECTORS/v1_native" | grep -c '\.json\.gz$')
          echo "$n opcode files"
          test "$n" -eq 29
          test -f "$V20_VECTORS/v1_native/metadata.json"
          du -sh "$V20_VECTORS"

      - name: 80186 core — the fifteen added opcodes
        env:
          V20_VECTORS: ${{ github.workspace }}/v20-vectors
        run: node scripts/grind-i8086-v20.mjs

      - name: 80186 disassembler — on text and length
        env:
          V20_VECTORS: ${{ github.workspace }}/v20-vectors
        run: node scripts/grind-i8086-v20-disasm.mjs


  # ---------------------------------------------------------------------
  # The OTHER two CPU cores' vectors, which until now ran nowhere at all.
  #
  # The `vectors` job above closed this for the 8086 and its own comment said
  # the other two still had no job. It was worse than that: `grind-z80.mjs`
  # and `grind-w65c02.mjs` had no evidence behind them ANYWHERE — not in CI,
  # and not on the developer box either, because neither suite was cloned. The
  # dependent tests all said `t.skip('vector suite not cloned')` and had done
  # for as long as they had existed.
  #
  # Both suites are MIT. Measured locally before this job was written, because
  # a job nobody has run is not a gate:
  #
  #     z80    1604/1604 files, 0 fail             1m41s
  #     65c02  2540000/2540000 vectors, 256 opcodes  1m19s
  #
  # Three minutes of grinding, so the CLONES are the cost here, not the work.
  #
  # Nightly and on demand rather than per push — see the note on `schedule`.
  vectors-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Fetch the z80 suite
        run: git clone --depth 1 --filter=blob:none
             https://github.com/SingleStepTests/z80 "$HOME/code/z80-vectors"
      - name: Fetch the 65x02 suite (WDC variant only)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/SingleStepTests/65x02 "$HOME/code/65x02-vectors"
          cd "$HOME/code/65x02-vectors" && git sparse-checkout set wdc65c02/v1

      # Assert the suites arrived BEFORE grinding them. Without this, a clone
      # that fetched nothing produces a grinder that finds no files, and the
      # grinder's own "no test files matched" exit is the only thing standing
      # between that and a green run.
      - name: The suites are actually here
        run: node scripts/oracle-census.mjs --require z80-vectors,65c02-vectors

      - name: Z80 — all 1,604 opcode files
        run: node scripts/grind-z80.mjs
      - name: 65C02 — all 256 opcodes
        run: node scripts/grind-w65c02.mjs

      # With both suites present these stop skipping, which is the point: the
      # per-push run reports them as skips and this run is where they execute.
      - name: The suite-gated unit tests, no longer skipping
        run: node --test test/z80-disasm.test.mjs test/w65c02.test.mjs test/w65c02-disasm.test.mjs
