name: Owned 386 masked PIC IMR pinned build only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-pic-imr-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: publication
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a6f605280f778b2bc409ef97ac3b40e15874530c
          path: frozen-owned-pic-imr
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install and record build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/owned-pic-imr-context"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libltdl-dev libnode-dev
          test -r /usr/include/node/node_api.h
          {
            dpkg-query -W build-essential g++ libc6-dev libltdl-dev libnode-dev nodejs
            sha256sum /usr/include/node/node_api.h
            git -C publication rev-parse HEAD
            git -C frozen-owned-pic-imr rev-parse HEAD
            node --version
            g++ --version
            uname -a
            lscpu
            df -h "$RUNNER_TEMP"
            sha256sum publication/scripts/ci-build-i80386-native-owned-pic-imr.py
          } > "$RUNNER_TEMP/owned-pic-imr-context/context.txt"
      - name: Fetch pinned pristine Bochs
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/owned-pic-imr-pristine"
          git -C "$RUNNER_TEMP/owned-pic-imr-pristine" remote add origin https://github.com/bochs-emu/Bochs.git
          git -C "$RUNNER_TEMP/owned-pic-imr-pristine" fetch --depth=1 --no-tags origin 0e45b736ef9792eb9b752b0a35db49eaf2faea47
          git -C "$RUNNER_TEMP/owned-pic-imr-pristine" checkout --detach FETCH_HEAD
      - name: Prepare, compile and statically authenticate ABI4
        shell: bash
        run: |
          set -euo pipefail
          python3 publication/scripts/ci-build-i80386-native-owned-pic-imr.py \
            "$GITHUB_WORKSPACE/frozen-owned-pic-imr" \
            "$RUNNER_TEMP/owned-pic-imr-evidence" \
            "$RUNNER_TEMP/owned-pic-imr-prepared" \
            "$RUNNER_TEMP/owned-pic-imr-pristine" \
            > "$RUNNER_TEMP/owned-pic-imr-context/parent.stdout" \
            2> "$RUNNER_TEMP/owned-pic-imr-context/parent.stderr"
      - name: Retain build evidence, sources and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-pic-imr-build-a6f60528-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owned-pic-imr-context
            ${{ runner.temp }}/owned-pic-imr-evidence
          if-no-files-found: error
          retention-days: 14
