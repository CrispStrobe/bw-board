name: CI tier gate

# CI tiers (owner decision 2026-10-14, LANES "CI tiers"). Branch pushes run
# only the FAST tier; the THOROUGH tier (ci.yml vectors/corpus/vectors186/
# vectors-full, harris-native, x86-xv6) runs on master, nightly, on demand,
# and on a pull request labelled `ci:full`. This one cheap job keeps
# "merge only when every check on the exact head is green" meaningful: it
# passes a docs-only PR (LANES.md, docs/, spec-updates/, *.md) or a PR that
# carries `ci:full`, and FAILS any other code PR, so a code change cannot
# show all checks green without the thorough tier having run on its head.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ci-requested:
    name: full CI requested
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Docs-only, or labelled ci:full
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HAS_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          if [ "$HAS_FULL" = "true" ]; then
            echo "ci:full label present: the thorough tier runs on this head."
            exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "::error::could not list the changed files of this PR"
            exit 1
          fi
          code=$(grep -Ev '^(LANES\.md|docs/.*|spec-updates/.*|.*\.md)$' "$RUNNER_TEMP/changed.txt" || true)
          if [ -z "$code" ]; then
            echo "Docs-only PR ($(wc -l < "$RUNNER_TEMP/changed.txt") files): the thorough tier is not required."
            exit 0
          fi
          echo "Code paths changed:"
          echo "$code" | head -50
          echo "::error::code change: add the ci:full label so the thorough tier runs before merge"
          exit 1
