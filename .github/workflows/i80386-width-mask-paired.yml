name: Mixed-width ALU public paired measurement
on:
  push:
    branches: [lane/386-width-mask-public-paired-20261015]
permissions:
  contents: read
concurrency:
  group: width-mask-public-paired-${{ github.sha }}
  cancel-in-progress: false
jobs:
  paired:
    if: github.repository == 'CrispStrobe/bw-board' && github.ref == 'refs/heads/lane/386-width-mask-public-paired-20261015' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: publication
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            scripts/i80386-width-mask-paired
            test/i80386-width-mask-paired-fixture.test.mjs
            src/experimental/i80386.js
            .github/workflows/i80386-width-mask-paired.yml
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3646417a959b5aa9f93ac446398ea9cacd5a6da5
          path: source-a
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            scripts/lib/i80386-windows-pointer-feedback.mjs
            scripts/lib/i80386-windows-vga-480-frame.mjs
            scripts/probe-i80386-windows-enhanced.mjs
            src/adc0809.js
            src/at-8042-a20.js
            src/at-ps2-mouse.js
            src/at-system-control.js
            src/audio-bus.js
            src/cga-card.js
            src/chip-ledger.js
            src/dac0832.js
            src/ega-card.js
            src/experimental/ata16.js
            src/experimental/i80286-protected.js
            src/experimental/i80386-at-machine.js
            src/experimental/i80386-code16-block-decode.js
            src/experimental/i80386-code16-coverage.js
            src/experimental/i80386-code16-window.js
            src/experimental/i80386.js
            src/experimental/vga-memory.js
            src/hercules-card.js
            src/i8086-machine.js
            src/i8086-ram-words.js
            src/i8086.js
            src/i8088-cycles.js
            src/i8088-timing.js
            src/i8237.js
            src/i8251.js
            src/i8254.js
            src/i8255.js
            src/i8259.js
            src/machine-checkpoint.js
            src/mc146818.js
            src/mc6845.js
            src/mc6850.js
            src/ne2000.js
            src/ns16c550.js
            src/pc-speaker.js
            src/sb-dsp.js
            src/upd765.js
            src/vga-card.js
            src/ym3812.js
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f6863484d02b4c4b0ce56415054f2e6a0c154097
          path: source-b
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            scripts/lib/i80386-windows-pointer-feedback.mjs
            scripts/lib/i80386-windows-vga-480-frame.mjs
            scripts/probe-i80386-windows-enhanced.mjs
            src/adc0809.js
            src/at-8042-a20.js
            src/at-ps2-mouse.js
            src/at-system-control.js
            src/audio-bus.js
            src/cga-card.js
            src/chip-ledger.js
            src/dac0832.js
            src/ega-card.js
            src/experimental/ata16.js
            src/experimental/i80286-protected.js
            src/experimental/i80386-at-machine.js
            src/experimental/i80386-code16-block-decode.js
            src/experimental/i80386-code16-coverage.js
            src/experimental/i80386-code16-window.js
            src/experimental/i80386.js
            src/experimental/vga-memory.js
            src/hercules-card.js
            src/i8086-machine.js
            src/i8086-ram-words.js
            src/i8086.js
            src/i8088-cycles.js
            src/i8088-timing.js
            src/i8237.js
            src/i8251.js
            src/i8254.js
            src/i8255.js
            src/i8259.js
            src/machine-checkpoint.js
            src/mc146818.js
            src/mc6845.js
            src/mc6850.js
            src/ne2000.js
            src/ns16c550.js
            src/pc-speaker.js
            src/sb-dsp.js
            src/upd765.js
            src/vga-card.js
            src/ym3812.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.20.2
      - name: Tiny authored fixture and mock policy controls
        working-directory: publication
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          /usr/bin/timeout 30s node --test --test-concurrency=1 test/i80386-width-mask-paired-fixture.test.mjs
          /usr/bin/timeout 30s /usr/bin/python3 -I -B scripts/i80386-width-mask-paired/controls.py
      - name: Fixed resource-owned whole Node measurement
        shell: bash
        env:
          BW_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C publication rev-parse HEAD)" = "$BW_EXPECTED_HEAD"
          unit="bw-width-mask-paired-${GITHUB_RUN_ID}-1.service"
          context="$RUNNER_TEMP/width-mask-public-context-${GITHUB_RUN_ID}-1"
          mkdir "$context"
          cpu=$(/usr/bin/python3 -I -c 'import os;print(min(os.sched_getaffinity(0)))')
          {
            printf 'unit=%s cpu=%s\n' "$unit" "$cpu"
            node --version
            /usr/bin/python3 --version
            /usr/bin/systemd-run --version
            sha256sum "$(command -v node)" /usr/bin/python3 /usr/bin/systemd-run /usr/bin/taskset /usr/bin/timeout
            uname -a
            lscpu
          } > "$context/runtime-original.txt"
          # The service owns wrapper and children. Client timeout alone is not
          # cleanup proof; RuntimeMaxSec and KillMode bind service cleanup.
          /usr/bin/sudo -n /usr/bin/timeout --signal=TERM --kill-after=10s 25m \
            /usr/bin/systemd-run --wait --pipe --collect --unit "$unit" \
            --property "User=$(id -un)" --property "Group=$(id -gn)" \
            --property "WorkingDirectory=$GITHUB_WORKSPACE/publication" \
            --property "AllowedCPUs=$cpu" \
            --property CPUQuota=100% --property CPUQuotaPeriodSec=100ms \
            --property MemoryMax=1073741824 --property MemorySwapMax=0 \
            --property RuntimeMaxSec=23min --property KillMode=control-group \
            --property TimeoutStopSec=5s --property TasksMax=64 \
            --setenv "PATH=$PATH" --setenv LANG=C --setenv LC_ALL=C \
            --setenv GITHUB_ACTIONS=true --setenv GITHUB_REPOSITORY=CrispStrobe/bw-board \
            --setenv "GITHUB_RUN_ID=$GITHUB_RUN_ID" --setenv GITHUB_RUN_ATTEMPT=1 \
            --setenv "RUNNER_TEMP=$RUNNER_TEMP" --setenv "BW_EXPECTED_HEAD=$BW_EXPECTED_HEAD" \
            --setenv "BW_CODE16_UNIT=$unit" \
            /usr/bin/taskset --cpu-list "$cpu" /usr/bin/python3 -I -B \
              "$GITHUB_WORKSPACE/publication/scripts/i80386-width-mask-paired/run.py" \
            > "$context/parent.stdout" 2> "$context/parent.stderr"
      - name: Observe exact owned service and cgroup cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          unit="bw-width-mask-paired-${GITHUB_RUN_ID}-1.service"
          context="$RUNNER_TEMP/width-mask-public-context-${GITHUB_RUN_ID}-1"
          mkdir -p "$context"
          set +e
          /usr/bin/sudo -n /usr/bin/systemctl show "$unit" \
            --property LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,ExecMainPID \
            > "$context/unit-before-cleanup.original" 2> "$context/unit-before-cleanup.stderr"
          printf '%s\n' "$?" > "$context/unit-before-cleanup.exit"
          /usr/bin/sudo -n /usr/bin/timeout --signal=KILL 10s /usr/bin/systemctl stop "$unit" \
            > "$context/unit-stop.original" 2> "$context/unit-stop.stderr"
          printf '%s\n' "$?" > "$context/unit-stop.exit"
          /usr/bin/sudo -n /usr/bin/systemctl show "$unit" \
            --property LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,ExecMainPID \
            > "$context/unit-after-cleanup.original" 2> "$context/unit-after-cleanup.stderr"
          printf '%s\n' "$?" > "$context/unit-after-cleanup.exit"
          set -e
          /usr/bin/python3 -I - "$unit" "$context" <<'PYCODE'
          import json,sys,stat
          from pathlib import Path
          unit,context=sys.argv[1],Path(sys.argv[2])
          raw=(context/'unit-after-cleanup.original').read_bytes()
          if len(raw)>8192:raise ValueError('unit state cap')
          state={}
          for line in raw.decode('utf8').splitlines():
              key,value=line.split('=',1)
              if key in state:raise ValueError('duplicate unit state')
              state[key]=value
          expected={'LoadState','ActiveState','SubState','Result','ExecMainCode','ExecMainStatus','ExecMainPID'}
          if set(state)!=expected:raise ValueError('unit state fields absent')
          directory=Path('/sys/fs/cgroup/system.slice')/unit
          try:
              observed=directory.lstat()
          except FileNotFoundError:
              observed=None
          if observed is not None:
              if not stat.S_ISDIR(observed.st_mode):raise ValueError('cgroup directory type')
              body=(directory/'cgroup.procs').read_bytes()
              (context/'cgroup-procs-after.original').write_bytes(body)
              if len(body)>8192:raise ValueError('cgroup census cap')
              empty=body.strip()==b''
              disposition='present-empty' if empty else 'present-nonempty'
          else:
              empty=True;disposition='absent'
          terminal=state['LoadState']=='not-found' or (state['LoadState']=='loaded' and state['ActiveState'] in ('inactive','failed') and state['SubState'] in ('dead','failed','exited') and state['ExecMainPID']=='0')
          result={'schema':'bw.width-mask-owned-service-cleanup.v1','unit':unit,'serviceState':state,'cgroupDisposition':disposition,'terminalOrAbsentObserved':terminal,'emptyOrAbsentCgroupObserved':empty,'complete':terminal and empty}
          (context/'owned-service-cleanup.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          if not result['complete']:raise ValueError('owned service cleanup uncertain')
          PYCODE
      - name: Independent original-only ALU reader
        if: success()
        shell: bash
        run: |
          /usr/bin/timeout 30s /usr/bin/python3 -I -B publication/scripts/i80386-width-mask-paired/reader.py --packet "$RUNNER_TEMP/width-mask-public-paired-${GITHUB_RUN_ID}-1" "$RUNNER_TEMP/width-mask-public-context-${GITHUB_RUN_ID}-1"
      - name: Retain complete or first failed original packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: width-mask-public-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/width-mask-public-context-${{ github.run_id }}-1
            ${{ runner.temp }}/width-mask-public-paired-${{ github.run_id }}-1
          if-no-files-found: error
          retention-days: 14
