name: x86 xv6 ordinary-JS snapshot paired gate

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: x86-xv6-js-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  affected-oracle-and-pairs:
    if: >-
      github.event.label.name == 'x86-xv6-js-snapshot-paired' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_BEFORE_HEAD: 6e5662bec11442e373a2489f213bc506438373e8
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 20
          persist-credentials: false
      - name: Admit exact checkouts and source controls
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          test "$(git --no-replace-objects rev-parse HEAD)" = "$BW_EXPECTED_HEAD"
          test -z "$(git --no-replace-objects status --porcelain --untracked-files=all)"
          test "$(git --no-replace-objects merge-base "$BW_BEFORE_HEAD" "$BW_EXPECTED_HEAD")" = "$BW_BEFORE_HEAD"
          git worktree add --detach "$RUNNER_TEMP/xv6-js-before" "$BW_BEFORE_HEAD"
          test "$(git --no-replace-objects -C "$RUNNER_TEMP/xv6-js-before" rev-parse HEAD)" = "$BW_BEFORE_HEAD"
          test -z "$(git --no-replace-objects -C "$RUNNER_TEMP/xv6-js-before" status --porcelain --untracked-files=all)"
          timeout 30s python3 scripts/xv6-js-snapshot-paired/policy_control.py
          timeout 30s python3 scripts/xv6-js-snapshot-paired/run_control.py
          timeout 30s python3 scripts/xv6-js-acceptance/policy_control.py
          timeout 30s python3 scripts/xv6-js-acceptance/run_control.py
          test -z "$(git --no-replace-objects status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
      - name: Install bounded guest tools
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 600s sudo apt-get update
          timeout 600s sudo apt-get install -y gcc-multilib binutils qemu-system-x86
      - name: Run affected fault and independent QEMU oracle
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle"
          timeout 60s node --test \
            test/i80386-instruction-snapshot-ownership.test.mjs \
            test/i80386-segment-load-contract.test.mjs \
            test/i80386-fault-delivery.test.mjs \
            test/i80386-code32-rep-pf.test.mjs \
            > "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/tests.stdout" \
            2> "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/tests.stderr"
          timeout 60s node scripts/run-i80386-code32-rep-pf-js.mjs \
            "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/js-capture.json.gz" \
            > "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/js.stdout" \
            2> "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/js.stderr"
          timeout 30s node scripts/run-i80386-code32-rep-pf-qemu.mjs \
            "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/qemu-receipt.json" \
            "$(command -v qemu-system-i386)" \
            > "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/qemu.stdout" \
            2> "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/qemu.stderr"
          node scripts/xv6-js-snapshot-paired/oracle-check.mjs \
            "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/js-capture.json.gz" \
            "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/qemu-receipt.json" \
            "$RUNNER_TEMP/xv6-js-snapshot/affected-oracle/check.json" \
            "$BW_EXPECTED_HEAD"
      - name: Fetch exact MIT xv6 source
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          git init "$RUNNER_TEMP/xv6-public"
          git -C "$RUNNER_TEMP/xv6-public" remote add origin https://github.com/mit-pdos/xv6-public.git
          timeout 180s git -C "$RUNNER_TEMP/xv6-public" fetch --depth 1 origin eeb7b415dbcb12cc362d0783e41c3d1f44066b17
          git -C "$RUNNER_TEMP/xv6-public" checkout --detach FETCH_HEAD
          test "$(git --no-replace-objects -C "$RUNNER_TEMP/xv6-public" rev-parse HEAD)" = eeb7b415dbcb12cc362d0783e41c3d1f44066b17
          test -z "$(git --no-replace-objects -C "$RUNNER_TEMP/xv6-public" status --porcelain --untracked-files=all)"
      - name: Build one fresh 4 MiB stock xv6 image
        shell: bash
        env:
          XV6_SRC: ${{ runner.temp }}/xv6-public
          XV6_STOCK_4M_OUT: ${{ runner.temp }}/xv6-stock-4m
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 900s node scripts/build-xv6-stock-4m.mjs \
            > "$RUNNER_TEMP/xv6-js-snapshot/build.stdout" \
            2> "$RUNNER_TEMP/xv6-js-snapshot/build.stderr"
          cp "$XV6_STOCK_4M_OUT/bw-xv6-stock-4m-receipt.json" \
            "$RUNNER_TEMP/xv6-js-snapshot/xv6-build.json"
      - name: Run exact-source ordinary-JS semantic and paired timing gate
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p "$RUNNER_TEMP/xv6-js-snapshot/pairs"
          timeout 72m python3 scripts/xv6-js-snapshot-paired/run.py \
            --before "$RUNNER_TEMP/xv6-js-before" \
            --after "$GITHUB_WORKSPACE" \
            --head "$BW_EXPECTED_HEAD" \
            --image-dir "$RUNNER_TEMP/xv6-stock-4m" \
            --output "$RUNNER_TEMP/xv6-js-snapshot/pairs" \
            > "$RUNNER_TEMP/xv6-js-snapshot/parent.stdout" \
            2> "$RUNNER_TEMP/xv6-js-snapshot/parent.stderr"
      - name: Preserve bounded raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x86-xv6-js-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/xv6-js-snapshot/
          if-no-files-found: warn
          retention-days: 7
