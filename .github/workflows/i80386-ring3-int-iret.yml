          set -e
          ring3_setup_unit="/sys/fs/cgroup/system.slice/bw-ring3-setup-v8-${GITHUB_RUN_ID}-1.service"
          ring3_setup_after=absent
          if test -e "$ring3_setup_unit"; then ring3_setup_after=present; fi
          /usr/bin/python3 -I -S -B -c 'import json,sys; print(json.dumps({"schema":"bw.ring3.setup-outer-terminal.v8","runId":sys.argv[1],"unit":sys.argv[2],"systemdRunExitCode":int(sys.argv[3]),"outsideCleanupExitCode":int(sys.argv[4]),"cgroupAfter":sys.argv[5]},sort_keys=True,separators=(",",":")))' \
