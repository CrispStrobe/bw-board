name: Ring3 INT80 IRETD source controls
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/i80386-ring3-int-iret.yml'
      - 'scripts/i80386-ring3-int-iret/**'
      - 'test/i80386-ring3-int-iret.test.mjs'
      - 'src/experimental/i80386.js'
      - 'package.json'
permissions:
  contents: read
concurrency:
  group: ring3-source-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      PYTHONPATH: ''
      PYTHONHOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Pure fixture and standalone controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects -c gc.auto=0 -c maintenance.auto=false rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(node --version)" = v22.23.3
          node --test test/i80386-ring3-int-iret.test.mjs
          /usr/bin/python3 -B scripts/i80386-ring3-int-iret/controls.py
          /usr/bin/python3 -B scripts/i80386-ring3-int-iret/run.py --controls
