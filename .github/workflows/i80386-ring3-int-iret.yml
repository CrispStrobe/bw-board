          test "$(stat -c %s build/i80386-ring3-setup-runtime-inventory-v8/outside-cleanup.original.json)" -le 16384
          test "$(stat -c %s build/i80386-ring3-setup-runtime-inventory-v8/outside-cleanup.stderr)" -le 131072
          test "$ring3_setup_exit" -eq 0
          test "$ring3_cleanup_exit" -eq 0
          test "$ring3_setup_after" = absent
      - name: Retain v8 setup and runtime originals
        if: always()
