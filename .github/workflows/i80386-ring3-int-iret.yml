name: Ring3 INT80 IRETD source controls
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '.github/workflows/i80386-ring3-int-iret.yml'
      - 'scripts/i80386-ring3-int-iret/**'
      - 'test/i80386-ring3-int-iret.test.mjs'
      - 'src/experimental/i80386.js'
      - 'package.json'
permissions:
  contents: read
concurrency:
  group: ring3-source-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  controls:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      PYTHONPATH: ''
      PYTHONHOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Pure fixture and standalone controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects -c gc.auto=0 -c maintenance.auto=false rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(node --version)" = v22.23.3
          node --test test/i80386-ring3-int-iret.test.mjs
          /usr/bin/python3 -B scripts/i80386-ring3-int-iret/controls.py
          /usr/bin/python3 -B scripts/i80386-ring3-int-iret/controls.py --prerequisites-only
          /usr/bin/python3 -B scripts/i80386-ring3-int-iret/controls.py --runtime-only
          /usr/bin/python3 -B scripts/i80386-ring3-int-iret/run.py --controls
  # Installation scaffold only. BOTH this literal guard and the source guard
  # require separate review before any official event is authorized.
  hosted-envelope-installation:
    if: ${{ false && github.event.action == 'labeled' && github.event.label.name == 'x86-ring3-int-iret-actual' && github.actor == 'CrispStrobe' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_RING3_APPROVED_REQUEST_SHA256: ${{ vars.BW_RING3_APPROVED_REQUEST_SHA256 }}
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      PYTHONPATH: ''
      PYTHONHOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Disabled hosted prerequisite observation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects -c gc.auto=0 -c maintenance.auto=false rev-parse HEAD)" = "$BW_EXPECTED_HEAD"
          export BW_EXPECTED_TREE="$(git --no-replace-objects -c gc.auto=0 -c maintenance.auto=false rev-parse 'HEAD^{tree}')"
          ring3_invoker_uid="$(id -u)"
          ring3_invoker_gid="$(id -g)"
          sudo -- /usr/bin/env -i LANG=C.UTF-8 HOME=/nonexistent PATH=/usr/bin:/bin \
            SUDO_UID="$ring3_invoker_uid" SUDO_GID="$ring3_invoker_gid" \
            BW_EXPECTED_HEAD="$BW_EXPECTED_HEAD" BW_EXPECTED_TREE="$BW_EXPECTED_TREE" \
            BW_RING3_APPROVED_REQUEST_SHA256="$BW_RING3_APPROVED_REQUEST_SHA256" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_ACTOR="$GITHUB_ACTOR" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_JOB="$GITHUB_JOB" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            /usr/bin/python3 -I -B scripts/i80386-ring3-int-iret/run.py --hosted-prerequisites
  # Independent candidate inventory only. No automatic runtime approval,
  # resource setup, fallback installation or guest execution.
  runtime-inventory:
    if: ${{ false && github.event.action == 'labeled' && github.event.label.name == 'x86-ring3-runtime-inventory' && github.actor == 'CrispStrobe' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BW_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BW_RING3_INVENTORY_REQUEST_SHA256: ${{ vars.BW_RING3_INVENTORY_REQUEST_SHA256 }}
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      PYTHONPATH: ''
      PYTHONHOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Disabled independent runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects -c gc.auto=0 -c maintenance.auto=false rev-parse HEAD)" = "$BW_EXPECTED_HEAD"
          export BW_EXPECTED_TREE="$(git --no-replace-objects -c gc.auto=0 -c maintenance.auto=false rev-parse 'HEAD^{tree}')"
          /usr/bin/env -i LANG=C.UTF-8 HOME=/nonexistent PATH=/usr/bin:/bin \
            BW_EXPECTED_HEAD="$BW_EXPECTED_HEAD" BW_EXPECTED_TREE="$BW_EXPECTED_TREE" \
            BW_RING3_INVENTORY_REQUEST_SHA256="$BW_RING3_INVENTORY_REQUEST_SHA256" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_ACTOR="$GITHUB_ACTOR" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_JOB="$GITHUB_JOB" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            /usr/bin/python3 -I -B scripts/i80386-ring3-int-iret/reader.py --inventory-runtime
