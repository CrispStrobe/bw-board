            BW_EXPECTED_HEAD="$BW_EXPECTED_HEAD" BW_EXPECTED_TREE="$BW_EXPECTED_TREE" \
            BW_RING3_SETUP_INVENTORY_V8_REQUEST_SHA256="$BW_RING3_SETUP_INVENTORY_V8_REQUEST_SHA256" \
            BW_RING3_SETUP_INVENTORY_V8_REQUEST_B64="$BW_RING3_SETUP_INVENTORY_V8_REQUEST_B64" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
