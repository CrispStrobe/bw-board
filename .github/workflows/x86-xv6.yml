name: x86 xv6 lane

on:
  push:
    paths:
      - 'src/experimental/**'
      - 'test/i80386*'
      - 'scripts/build-xv6-stock-4m.mjs'
      - 'scripts/probe-xv6-stock.mjs'
      - '.github/workflows/x86-xv6.yml'
  pull_request:
    paths:
      - 'src/experimental/**'
      - 'test/i80386*'
      - 'scripts/build-xv6-stock-4m.mjs'
      - 'scripts/probe-xv6-stock.mjs'
      - '.github/workflows/x86-xv6.yml'
  workflow_dispatch:

jobs:
  x86-xv6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch exact source revision of dated FreeDOS evidence
        run: git fetch --no-tags --depth=1 origin 46de3726abe68cb8ff106ddb4131f5d0b7bd7578
      - name: Install 32-bit build toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch pinned MIT xv6 source
        run: |
          git init /tmp/xv6-public
          git -C /tmp/xv6-public remote add origin https://github.com/mit-pdos/xv6-public.git
          git -C /tmp/xv6-public fetch --depth 1 origin eeb7b415dbcb12cc362d0783e41c3d1f44066b17
          git -C /tmp/xv6-public checkout --detach FETCH_HEAD
          test "$(git -C /tmp/xv6-public rev-parse HEAD)" = eeb7b415dbcb12cc362d0783e41c3d1f44066b17
      - run: node --test test/i80386*.test.mjs
      - run: node scripts/build-xv6-stock-4m.mjs
        env:
          XV6_SRC: /tmp/xv6-public
          XV6_STOCK_4M_OUT: /tmp/xv6-stock-4m
      - run: node scripts/build-xv6-stock-4m.mjs
        env:
          XV6_SRC: /tmp/xv6-public
          XV6_PHYSTOP: '0xE00000'
          XV6_STOCK_OUT: /tmp/xv6-stock-14m
      - name: Boot stock xv6 with redistributable Bochs BIOS and exercise filesystem
        run: |
          XV6_FIRMWARE=bochs XV6_STEPS=30000000 XV6_STOP_ON_EXPECT=1 \
            XV6_COMMAND=$'echo BW_XV6_FREE_BIOS_FS_OK > bwfile; cat bwfile; rm bwfile\r' \
            XV6_EXPECT_SERIAL=$'\nBW_XV6_FREE_BIOS_FS_OK\n$ ' \
            node scripts/probe-xv6-stock.mjs > /tmp/xv6-stock-free-bios-boot.json
          node -e "let r=require('/tmp/xv6-stock-free-bios-boot.json'); if (r.firmware!=='bochs' || !r.milestones.exec || !r.userModeEntries.length || !r.postBootInterrupts.some(i=>i.irq===14)) process.exit(1)"
      - name: Boot 14 MiB stock xv6 with redistributable Bochs BIOS
        run: |
          XV6_FIRMWARE=bochs XV6_PROFILE=14m XV6_STEPS=30000000 XV6_STOP_ON_EXPECT=1 \
            XV6_COMMAND=$'echo BW_XV6_14M_FREE_OK\r' \
            XV6_EXPECT_SERIAL=$'\nBW_XV6_14M_FREE_OK\n$ ' \
            node scripts/probe-xv6-stock.mjs > /tmp/xv6-stock-14m-free-bios-boot.json
          node -e "let r=require('/tmp/xv6-stock-14m-free-bios-boot.json'); if (r.firmware!=='bochs' || r.profile!=='14m' || !r.milestones.exec || !r.userModeEntries.length) process.exit(1)"
      - name: Run stock xv6 process-exhaustion regression
        run: |
          XV6_FIRMWARE=bochs XV6_STEPS=40000000 XV6_STOP_ON_EXPECT=1 \
            XV6_COMMAND=$'forktest\r' XV6_EXPECT_SERIAL=$'fork test OK\n$ ' \
            node scripts/probe-xv6-stock.mjs > /tmp/xv6-stock-free-bios-forktest.json
          node -e "let r=require('/tmp/xv6-stock-free-bios-forktest.json'); if (r.firmware!=='bochs' || !r.milestones.syscall || !r.userModeEntries.length) process.exit(1)"
      - name: Upload build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xv6-stock-build-receipts
          path: |
            /tmp/xv6-stock-4m/bw-xv6-stock-4m-receipt.json
            /tmp/xv6-stock-14m/bw-xv6-stock-14m-receipt.json
            /tmp/xv6-stock-free-bios-boot.json
            /tmp/xv6-stock-14m-free-bios-boot.json
            /tmp/xv6-stock-free-bios-forktest.json
