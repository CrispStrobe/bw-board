name: Owned LE file readback
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: le-file-${{ github.event.pull_request.head.sha }}-${{ github.event.action }}
  cancel-in-progress: false
jobs:
  controls:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - run: |
          python3 -B scripts/i80386-dos32a-file-readback/controls.py
          node --test test/i80386-dos32a-file-readback.test.mjs
  actual:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'x86-dos32a-file-readback-actual' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Fixed component acquisition and source admission
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(node --version)" = v22.23.3
          mkdir "$RUNNER_TEMP/le-file-inputs"
          cd "$RUNNER_TEMP/le-file-inputs"
          curl -fL --max-time 120 -o freedos.zip https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-FloppyEdition.zip
          python3 -B "$GITHUB_WORKSPACE/scripts/i80386-dos32a-owned/acquire.py" freedos.zip floppy.img freedos-admission.json
          curl -fL --max-time 80 -o dos32a.exe https://raw.githubusercontent.com/amindlost/dos32a/06d8e3a0b2397d872205d6c99a7de0d6b8628bcc/binw/dos32a.exe
          curl -fL --max-time 80 -o license.txt https://raw.githubusercontent.com/amindlost/dos32a/06d8e3a0b2397d872205d6c99a7de0d6b8628bcc/license
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          python3 - "$RUNNER_TEMP" "$GITHUB_WORKSPACE" <<'PY'
          import json,pathlib,sys
          t,r=map(pathlib.Path,sys.argv[1:]);i=t/'le-file-inputs'
          data={'bios':str(r/'roms/free-at-bios/BIOS-bochs-legacy'),'vga':str(r/'roms/free-at-bios/vgabios-lgpl.bin'),
            'floppy':str(i/'floppy.img'),'extender':str(i/'dos32a.exe'),'license':str(i/'license.txt'),'scratch':str(t/'le-file-scratch')}
          (t/'le-file-input.json').write_text(json.dumps(data))
          PY
      - name: Bounded four fresh applications
        shell: bash
        run: |
          set -euo pipefail
          unit="bw-le-file-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$GITHUB_RUN_ATTEMPT" = 1
          touch "$RUNNER_TEMP/le-file-unit-requested"
          UNIT_WAIT_RC=0
          cpu=$(python3 -c 'import os;print(min(os.sched_getaffinity(0)))')
          node_dir=$(dirname "$(command -v node)")
          sudo systemd-run --unit="$unit" --wait --collect --pipe --uid="$(id -u)" --gid="$(id -g)" \
            -p RuntimeMaxSec=2500 -p TimeoutStopSec=5 -p KillMode=control-group \
            -p CPUQuota=100% -p CPUQuotaPeriodSec=100ms -p CPUAffinity="$cpu" \
            -p MemoryMax=1073741824 -p MemorySwapMax=0 \
            /usr/bin/env -i PATH="$node_dir:/usr/bin:/bin" PYTHONDONTWRITEBYTECODE=1 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /usr/bin/python3 -B "$GITHUB_WORKSPACE/scripts/i80386-dos32a-file-readback/source.py" run \
            "$RUNNER_TEMP/le-file-input.json" "$RUNNER_TEMP/le-file-originals" "$EXPECTED_HEAD" || UNIT_WAIT_RC=$?
          printf '%s\n' "$UNIT_WAIT_RC" > "$RUNNER_TEMP/le-file-unit-waited"
          test "$UNIT_WAIT_RC" = 0
          python3 -B scripts/i80386-dos32a-file-readback/reader.py --packet "$RUNNER_TEMP/le-file-originals"
      - name: Owned controller terminal and empty
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          unit="bw-le-file-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! test -f "$RUNNER_TEMP/le-file-unit-requested"; then
            echo 'owned-controller-not-requested; earlier staging did not complete'
            exit 0
          fi
          waited=0
          test ! -f "$RUNNER_TEMP/le-file-unit-waited" || waited=1
          LIST=$(sudo systemctl list-units --all --plain --no-legend "$unit.service")
          if test -n "$LIST"; then
            BEFORE=$(sudo systemctl show "$unit.service" --property=Id,LoadState,ActiveState,SubState,Result,ControlGroup,MainPID)
            printf '%s\n' "$BEFORE"
            printf '%s\n' "$BEFORE" | /usr/bin/grep -qx "Id=$unit.service"
            CONTROL_GROUP=$(printf '%s\n' "$BEFORE" | /usr/bin/sed -n 's/^ControlGroup=//p')
            test -z "$CONTROL_GROUP" || test "$CONTROL_GROUP" = "/system.slice/$unit.service"
            sudo systemctl stop "$unit.service"
            LIST=$(sudo systemctl list-units --all --plain --no-legend "$unit.service")
            if test -n "$LIST"; then
              AFTER=$(sudo systemctl show "$unit.service" --property=Id,ActiveState,SubState,Result,ControlGroup,MainPID)
              printf '%s\n' "$AFTER"
              printf '%s\n' "$AFTER" | /usr/bin/grep -qx "Id=$unit.service"
              printf '%s\n' "$AFTER" | /usr/bin/grep -qx 'MainPID=0'
              printf '%s\n' "$AFTER" | /usr/bin/grep -Eq '^ActiveState=(inactive|failed)$'
            else
              echo 'owned-controller-unit=collected-after-stop'
            fi
          else
            test "$waited" = 1
            echo 'owned-controller-unit=collected-after-wait'
          fi
          CG="/sys/fs/cgroup/system.slice/$unit.service"
          if test -d "$CG"; then
            MEMBERS=$(cat "$CG/cgroup.procs")
            test -z "$MEMBERS"
            echo 'owned-controller-cgroup=empty'
          else
            echo 'owned-controller-cgroup=absent'
          fi
          test "$waited" = 1
          printf 'owned-controller-terminal unit=%s\n' "$unit"
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: le-file-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/le-file-originals/**
          if-no-files-found: error
          retention-days: 14
