name: LabWired compiled edge callee inspection (diagnostic)
on:
  push:
    branches: ['perf/wasm-edge-callee-inspection-20261003']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: labwired-wasm-b
          path: engine
          run-id: '36915940413'
          github-token: ${{ github.token }}
      - name: Verify original production bytes before disassembly
        run: |
          mkdir evidence
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const info = JSON.parse(readFileSync('engine/BUILD-INFO.json'));
          if (info.ref !== '43b2d62f5a0fa24ae0b38a645069f5aaa78af685') throw Error('Source mismatch');
          const expected = {'labwired_wasm_bg.wasm': '7bd66fe4e926fbf14322621499f3fbddefefae763f61742c4c8c7312113b7a3d', 'labwired_wasm.js': 'b93d7f484286d64ae8f19d86bf67eb8d4309cf49720cbb06f59557c401b7ad73'};
          for (const [file, hash] of Object.entries(expected)) {
            const bytes = readFileSync('engine/nodejs/' + file);
            if (createHash('sha256').update(bytes).digest('hex') !== hash || info.targets.nodejs[file].sha256 !== hash || info.targets.nodejs[file].bytes !== bytes.length) throw Error('Original bytes mismatch');
          }
          writeFileSync('evidence/build-info.json', JSON.stringify(info, null, 2) + '\n', {flag: 'wx'});
          NODE
      - name: Portable selection checks
        run: node --test test/wasm-edge-inspection.test.mjs
      - name: Install disassembler on hosted runner only
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends wabt
      - name: Disassemble without executing engine and retain selected original text
        run: |
          wasm2wat --version > evidence/disassembler-version.txt
          wasm2wat engine/nodejs/labwired_wasm_bg.wasm -o "$RUNNER_TEMP/production.wat"
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {selectEdgeWat} from './scripts/lib/wasm-edge-inspection.mjs';
          const bytes = readFileSync(process.env.RUNNER_TEMP + '/production.wat');
          const receipt = {diagnosticOnly: true, toolCommit: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(), buildRun: '36915940413', coreCommit: '43b2d62f5a0fa24ae0b38a645069f5aaa78af685', wasmSha256: '7bd66fe4e926fbf14322621499f3fbddefefae763f61742c4c8c7312113b7a3d', fullWat: {bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex')}, ...selectEdgeWat(bytes.toString('utf8'))};
          writeFileSync('evidence/selected-callees.json', JSON.stringify(receipt, null, 2) + '\n', {flag: 'wx'});
          NODE
      - name: Preserve inspection even on failure (never engine bytes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-edge-inspection
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
