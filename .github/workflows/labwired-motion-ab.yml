name: LabWired motion artifact A/B (diagnostic only)
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Existing labwired-wasm run with build-B artifact
        required: true
        type: string
      baseline_commit:
        description: Exact 40-hex LabWired baseline source commit
        required: true
        type: string
      candidate_run:
        description: Existing labwired-wasm run with build-B artifact
        required: true
        type: string
      candidate_commit:
        description: Exact 40-hex LabWired candidate source commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    name: Same-runner A/B/B/A diagnostic (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: labwired-wasm-b
          path: baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: labwired-wasm-b
          path: candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Verify declared sources and actual artifact hashes
        env:
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          for (const label of ['baseline', 'candidate']) {
            const expected = process.env[label.toUpperCase() + '_COMMIT'];
            const info = JSON.parse(readFileSync(label + '/BUILD-INFO.json'));
            if (!/^[a-f0-9]{40}$/.test(expected) || info.ref !== expected) throw Error(label + ' source mismatch');
            for (const file of ['labwired_wasm.js', 'labwired_wasm_bg.wasm']) {
              const bytes = readFileSync(label + '/nodejs/' + file);
              const declared = info.targets.nodejs[file];
              if (bytes.length !== declared.bytes || createHash('sha256').update(bytes).digest('hex') !== declared.sha256) {
                throw Error(label + ' artifact hash mismatch: ' + file);
              }
            }
            writeFileSync(label + '/nodejs/package.json', JSON.stringify({type: 'commonjs'}));
          }
          NODE
      - name: Install unchanged guest compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Preserve source and runner provenance
        env:
          BASELINE_RUN: ${{ inputs.baseline_run }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          mkdir -p evidence
          cp baseline/BUILD-INFO.json evidence/baseline-build-info.json
          cp candidate/BUILD-INFO.json evidence/candidate-build-info.json
          {
            printf 'baseline_run=%s\ncandidate_run=%s\n' "$BASELINE_RUN" "$CANDIDATE_RUN"
            lscpu
            node --version
            arm-none-eabi-gcc --version
            sha256sum test/fixtures/labwired/microbit-motion/*
          } > evidence/runner.txt
      - name: Complete diagnostic without relabelling failed qualification windows
        run: node scripts/probe-labwired-motion-ab.mjs --baseline baseline/nodejs --candidate candidate/nodejs --out evidence/abba.json
      - name: Retain raw results even if the diagnostic itself fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motion-artifact-ab-diagnostic
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
