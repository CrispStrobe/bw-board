name: Nonidentity paging one correctness run (manual, disabled by default)
on:
  workflow_dispatch:
    inputs:
      enable_nonidentity_paging_execution:
        description: Root-reviewed first nonidentity paging execution only
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: i80386-nonidentity-paging-single-correctness
  cancel-in-progress: false
jobs:
  correctness:
    if: inputs.enable_nonidentity_paging_execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
      NODE_V8_COVERAGE: ''
      PYTHONPATH: ''
      PYTHONHOME: ''
      PYTHONSTARTUP: ''
      PYTHONINSPECT: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: nonidentity-paging-wrapper
          persist-credentials: false
          fetch-depth: 1
      - name: Record source context and require reviewed fixed bindings
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/nonidentity-paging-execution-context"
          python3 -B - <<'PY' > "$RUNNER_TEMP/nonidentity-paging-execution-context/source.stdout" 2> "$RUNNER_TEMP/nonidentity-paging-execution-context/source.stderr"
          import json,sys,os
          sys.path.insert(0,'nonidentity-paging-wrapper/scripts/nonidentity-paging-hosted')
          from parent import validate_contract,HERE
          validate_contract(json.load(open(HERE/'contract.json')))
          print(json.dumps({k:os.environ.get(k)for k in ['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME','RUNNER_OS']}))
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0333f5aca42bf60fa37c64bb574aee7084f9251c
          path: publication
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8df2dd7d6b88648b3fcedb6dd559e0dfc5daeb54
          path: nonidentity-paging-driver
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bochs-emu/Bochs
          ref: 0e45b736ef9792eb9b752b0a35db49eaf2faea47
          path: nonidentity-paging-pristine
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Restore exact build and run one bounded correctness child
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export BW_NONIDENTITY_PAGING_NODE="$(command -v node)"
          python3 -B nonidentity-paging-wrapper/scripts/nonidentity-paging-hosted/parent.py enabled > "$RUNNER_TEMP/nonidentity-paging-execution-context/parent.stdout" 2> "$RUNNER_TEMP/nonidentity-paging-execution-context/parent.stderr"
      - name: Retain first failure and all raw maps and streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonidentity-paging-one-correctness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nonidentity-paging-execution
            ${{ runner.temp }}/nonidentity-paging-execution-context
            ${{ runner.temp }}/nonidentity-paging-build-evidence
            ${{ github.workspace }}/nonidentity-paging-wrapper/scripts/nonidentity-paging-hosted
            ${{ github.workspace }}/nonidentity-paging-wrapper/scripts/cold-native-restore/archive.py
            ${{ github.workspace }}/nonidentity-paging-wrapper/scripts/cold-native-diagnostic/resources.py
            ${{ github.workspace }}/nonidentity-paging-wrapper/scripts/protected-ram-hosted/parent.py
            ${{ github.workspace }}/nonidentity-paging-wrapper/scripts/protected-stack-hosted/parent.py
            ${{ github.workspace }}/nonidentity-paging-wrapper/.github/workflows/i80386-nonidentity-paging-execution.yml
          include-hidden-files: true
          if-no-files-found: error
