name: LabWired repeated same-host orders (diagnostic)
on:
  push:
    branches: ['perf/wasm-same-host-orders-20261003']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    name: Repeated ordinary orders Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.2', '22.23.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fb13d48b7bc377bceb5da5a1d4ed5cd11555e162
          path: harness
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: labwired-wasm-b
          path: baseline
          run-id: '36915940413'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: labwired-wasm-b
          path: candidate
          run-id: '37117416202'
          github-token: ${{ github.token }}
      - name: Prepare original glue module context without changing declared bytes
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          for (const label of ['baseline', 'candidate']) writeFileSync(label + '/nodejs/package.json', JSON.stringify({type: 'commonjs'}));
          NODE
      - name: Install unchanged guest compiler on hosted runner only
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Portable parsing and guards
        run: node --test test/same-host-orders.test.mjs test/motion-ab-receipt.test.mjs test/f0-timing-receipt.test.mjs
      - name: Preserve runner and frozen harness provenance
        run: |
          mkdir evidence
          cp baseline/BUILD-INFO.json evidence/baseline-build-info.json
          cp candidate/BUILD-INFO.json evidence/candidate-build-info.json
          {
            git rev-parse HEAD
            git -C harness rev-parse HEAD
            lscpu
            node --version
            arm-none-eabi-gcc --version
          } > evidence/runner.txt
      - name: Four ordinary pairs on this VM; preserve failed floors
        run: node scripts/probe-labwired-same-host-orders.mjs --harness harness --baseline baseline/nodejs --candidate candidate/nodejs --out evidence/repeats
      - name: Retain all original receipts even on failure (no engines)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-host-orders-node-${{ matrix.node }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
