name: Owned 386 IN8 pinned build only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-in8-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      BW_HOT_NAPI_PROFILE: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: publication
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fe1eff2039520536350922a2164c8bbe29404c68
          path: frozen-owned-in8
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install and record build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/owned-in8-context"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libltdl-dev
          {
            git -C publication rev-parse HEAD
            git -C frozen-owned-in8 rev-parse HEAD
            node --version
            g++ --version
            uname -a
            lscpu
            df -h "$RUNNER_TEMP"
            sha256sum publication/scripts/ci-build-i80386-native-owned-in8.py
          } > "$RUNNER_TEMP/owned-in8-context/context.txt"
      - name: Fetch pinned pristine Bochs
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/owned-in8-pristine"
          git -C "$RUNNER_TEMP/owned-in8-pristine" remote add origin https://github.com/bochs-emu/Bochs.git
          git -C "$RUNNER_TEMP/owned-in8-pristine" fetch --depth=1 --no-tags origin 0e45b736ef9792eb9b752b0a35db49eaf2faea47
          git -C "$RUNNER_TEMP/owned-in8-pristine" checkout --detach FETCH_HEAD
      - name: Prepare, compile and statically authenticate ABI4
        shell: bash
        run: |
          set -euo pipefail
          python3 publication/scripts/ci-build-i80386-native-owned-in8.py \
            "$GITHUB_WORKSPACE/frozen-owned-in8" \
            "$RUNNER_TEMP/owned-in8-evidence" \
            "$RUNNER_TEMP/owned-in8-prepared" \
            "$RUNNER_TEMP/owned-in8-pristine" \
            > "$RUNNER_TEMP/owned-in8-context/parent.stdout" \
            2> "$RUNNER_TEMP/owned-in8-context/parent.stderr"
      - name: Retain build evidence, sources and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-in8-build-fe1eff20-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owned-in8-context
            ${{ runner.temp }}/owned-in8-evidence
          if-no-files-found: error
          retention-days: 14
