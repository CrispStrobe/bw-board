# The image stores the two fixed ROM sockets in ascending address order.
MEMORY {
    LOW:  start = $1800, size = $0400, file = %O, fill = yes, fillval = $EA;
    HIGH: start = $1C00, size = $0400, file = %O, fill = yes, fillval = $EA;
}
SEGMENTS {
    CASSETTE_0: load = LOW, type = ro, start = $1800;
    CASSETTE_1: load = LOW, type = ro, start = $1873;
    TEXT:     load = LOW,  type = ro;
    DISPLAY:  load = LOW,  type = ro, start = $1B00;
    COMPAT:   load = LOW,  type = ro;
    NMI:      load = HIGH, type = ro, start = $1C00;
    STARTUP:  load = HIGH, type = ro;
    WARM:     load = HIGH, type = ro, start = $1C4F;
    PANEL:    load = HIGH, type = ro;
    CRLF:     load = HIGH, type = ro, start = $1E2F;
    PRINTBYTE:load = HIGH, type = ro, start = $1E3B;
    HEXOUT:   load = HIGH, type = ro, start = $1E4C;
    GETCH:    load = HIGH, type = ro, start = $1E5A;
    IO:       load = HIGH, type = ro, start = $1E88;
    IOBODY:   load = HIGH, type = ro;
    OUTCH:    load = HIGH, type = ro, start = $1EA0;
    TX:       load = HIGH, type = ro;
    AK:       load = HIGH, type = ro, start = $1EFE;
    UTIL:     load = HIGH, type = ro;
    SCAND:    load = HIGH, type = ro, start = $1F19;
    SCANDS:   load = HIGH, type = ro, start = $1F1F;
    SEGMENTS7: load = HIGH, type = ro;
    INCPTR:   load = HIGH, type = ro, start = $1F63;
    GETKEY:   load = HIGH, type = ro, start = $1F6A;
    PACK:     load = HIGH, type = ro, start = $1FAC;
    VECTORS:  load = HIGH, type = ro, start = $1FFA;
}
